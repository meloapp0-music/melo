/* ─── receipts ─── */

function upsetsIn(B){
  const out = [];
  [].concat(B.wc, B.dv, [B.cc]).forEach(function(m){
    if (!m.a) return;
    const w = advOf(m.key, m.a, m.b);
    if (!w) return;
    const ws = w === m.a ? m.sa : m.sb, ls = w === m.a ? m.sb : m.sa;
    if (ws > ls) out.push({w:w, l:w === m.a ? m.b : m.a, ws:ws, ls:ls});
  });
  return out;
}

function receiptData(S){
  const A = bracketFor("AFC", S), N = bracketFor("NFC", S);
  const champ = (A.champ && N.champ) ? advOf("SB", A.champ, N.champ) : null;
  const divWinners = DIV_KEYS.map(function(k){ return {div:k, t:S.divRank[k][0].t}; });

  const field = {};
  ["AFC","NFC"].forEach(function(c){
    S.seeds[c].forEach(function(x){ if (!x.outside) field[x.t] = x.seed; });
  });

  const swings = ORDER.map(function(a){
    const ly = LAST_YEAR[a];
    return {t:a, d:R[a].w - ly[0], now:R[a], was:ly};
  }).sort(function(x, y){ return y.d - x.d; });

  const byRec = ORDER.slice().sort(function(a, b){
    return recPct(R[b]) - recPct(R[a]) || R[b].w - R[a].w;
  });

  let homePicks = 0, called = 0, ties = 0;
  for (let i = 0; i < NGAMES; i++){
    const r = resultOf(i);
    if (!r) continue;
    called++;
    if (r === "H") homePicks++;
    if (r === "T") ties++;
  }

  return {
    A:A, N:N, champ:champ, divWinners:divWinners, field:field, swings:swings, byRec:byRec,
    upsets:upsetsIn(A).concat(upsetsIn(N)),
    crashers:Object.keys(field).filter(function(t){ return LY_FIELD.indexOf(t) < 0; }),
    missing:LY_FIELD.filter(function(t){ return !field[t]; }),
    homePicks:homePicks, called:called, ties:ties
  };
}

/* lives at the foot of the Postseason page: you crown a champion, then scroll
   straight into what that commits you to */
function receiptsSections(S){
  const d = receiptData(S);
  const done = decidedCount();
  const wrap = el("div", {"class":"sect", style:"margin-top:46px;padding-top:34px;border-top:1px solid var(--rule)"});
  const hand = handCount(), filled = autoCount();
  wrap.appendChild(el("div", {"class":"pane-head"}, [
    el("h2", {}, ["Your receipts"]),
    el("p", {html:"Everything you just committed to, in one place, so it can be held against you in February." +
      (filled ? " <b>" + hand + " of " + NGAMES + "</b> of these games were called by you; the other " +
                filled + " were filled in from last season and are marked as such." : "")})
  ]));

  if (d.champ){
    const t = TEAMS[d.champ];
    const other = d.champ === d.A.champ ? d.N.champ : d.A.champ;
    wrap.appendChild(el("div", {"class":"rc-hero", style:"--c:" + t.pop}, [
      el("span", {"class":"eyebrow"}, ["Super Bowl LXI champions"]),
      el("div", {"class":"who"}, [t.city, el("br"), t.nick]),
      el("div", {"class":"line", html:"You have them beating <b>" + esc(TEAMS[other].name) +
        "</b> in Inglewood, after a <b>" + recStr(R[d.champ]) + "</b> regular season as the " +
        ordinal(d.field[d.champ]) + " seed."})
    ]));
  } else {
    wrap.appendChild(el("div", {"class":"rc-empty"}, [
      el("h3", {}, ["No champion yet"]),
      el("p", {style:"margin:0", "class":"", html:done < NGAMES
        ? "You have called <b>" + done + " of " + NGAMES + "</b> games. Finish the season and work the bracket above, and this writes itself."
        : "Work the bracket above and this writes itself."})
    ]));
  }

  if (!done){ return wrap; }

  /* your club's own verdict, ahead of the league-wide stuff */
  if (state.fav && TEAMS[state.fav] && R[state.fav].played){
    const f = state.fav, t = TEAMS[f], seed = d.field[f];
    const ly = LAST_YEAR[f], swing = R[f].w - ly[0];
    let run = "misses the playoffs";
    if (seed){
      if (d.champ === f) run = "wins it all";
      else if (d.A.champ === f || d.N.champ === f) run = "loses the Super Bowl";
      else if (d.A.cc.a === f || d.A.cc.b === f || d.N.cc.a === f || d.N.cc.b === f) run = "falls in the " + t.conf + " Championship";
      else if ([].concat(d.A.dv, d.N.dv).some(function(m){ return m.a === f || m.b === f; })) run = "falls in the Divisional round";
      else run = "makes the field as the " + ordinal(seed) + " seed";
    }
    wrap.appendChild(el("div", {"class":"sect", style:"margin-top:26px"}, [
      el("h3", {}, ["Your club"]),
      el("p", {}, ["The only line of this page that you actually have to live with."]),
      el("div", {"class":"favcard", style:"--c:" + t.pop + ";margin:0;cursor:default"}, [
        crest(f, "sm"),
        el("span", {"class":"txt"}, [
          el("span", {"class":"k"}, [t.divKey]),
          el("span", {"class":"n"}, [t.name + " — " + run]),
          el("span", {"class":"s", style:"display:block"}, [
            ly[0] + "-" + ly[1] + " last season · " +
            (swing > 0 ? "you have them +" + swing : swing < 0 ? "you have them " + swing : "you have them level") +
            (swing === 0 ? " on wins" : " wins")
          ])
        ]),
        el("span", {"class":"rc"}, [recStr(R[f])])
      ])
    ]));
  }

  /* division winners */
  const champs = el("div", {"class":"champs8"});
  d.divWinners.forEach(function(x){
    const t = TEAMS[x.t];
    champs.appendChild(el("div", {"class":"champ8", style:"--c:" + t.pop}, [
      crest(x.t, "xs"),
      el("span", {}, [el("span", {"class":"d"}, [x.div]), el("span", {"class":"n"}, [t.nick])]),
      el("span", {"class":"r"}, [recStr(R[x.t])])
    ]));
  });
  wrap.appendChild(el("div", {"class":"sect"}, [
    el("h3", {}, ["Your eight division winners"]),
    el("p", {}, ["Straight from the standings you built."]),
    champs
  ]));

  /* the takes */
  const takes = el("div", {"class":"takes"});
  const riser = d.swings[0], faller = d.swings[d.swings.length - 1];
  const best = d.byRec[0], worst = d.byRec[d.byRec.length - 1];

  function take(k, v, s, color, hot){
    return el("div", {"class":"take" + (hot ? " hot" : ""), style:color ? "--c:" + color : ""}, [
      el("div", {"class":"k"}, [k]),
      el("div", {"class":"v"}, [v]),
      el("div", {"class":"s", html:s})
    ]);
  }

  if (riser && riser.d > 0){
    takes.appendChild(take("Biggest riser", TEAMS[riser.t].nick,
      "You have them at <b>" + recStr(riser.now) + "</b> after " + riser.was[0] + "-" + riser.was[1] +
      " last year. That is <b>" + riser.d + " more wins</b>.", TEAMS[riser.t].pop, riser.d >= 6));
  }
  if (faller && faller.d < 0){
    takes.appendChild(take("Biggest faller", TEAMS[faller.t].nick,
      "From " + faller.was[0] + "-" + faller.was[1] + " down to <b>" + recStr(faller.now) +
      "</b> — you are docking them <b>" + Math.abs(faller.d) + " wins</b>.",
      TEAMS[faller.t].pop, faller.d <= -6));
  }
  takes.appendChild(take("Best in the league", TEAMS[best].nick,
    recStr(R[best]) + " · " + (d.field[best] ? ordinal(d.field[best]) + " seed in the " + TEAMS[best].conf
      : "and somehow not in your field"), TEAMS[best].pop));
  takes.appendChild(take("Worst in the league", TEAMS[worst].nick,
    "You have them finishing <b>" + recStr(R[worst]) + "</b>.", TEAMS[worst].pop));

  if (d.upsets.length){
    /* headline the most dramatic one: biggest seed gap, and knocking out a
       top seed outranks everything */
    const u = d.upsets.slice().sort(function(a, b){
      return (a.ls === 1 ? -1 : 0) - (b.ls === 1 ? -1 : 0) || (b.ws - b.ls) - (a.ws - a.ls) || a.ls - b.ls;
    })[0];
    takes.appendChild(take("Bracket buster", TEAMS[u.w].nick + " over " + TEAMS[u.l].nick,
      "The " + ordinal(u.ws) + " seed knocking out the " + ordinal(u.ls) + ". " +
      (d.upsets.length > 1 ? d.upsets.length + " lower seeds win in your bracket." : "Your only seeding upset."),
      TEAMS[u.w].pop, u.ls === 1));
  }
  if (d.crashers.length){
    const lead = d.crashers.slice().sort(function(a, b){ return recPct(R[b]) - recPct(R[a]); })[0];
    const rest = d.crashers.filter(function(t){ return t !== lead; }).map(function(t){ return TEAMS[t].nick; });
    takes.appendChild(take("Crashing the party", TEAMS[lead].nick,
      recStr(R[lead]) + " and into your field after missing it last season" +
      (rest.length ? ", along with " + listOf(rest) : "") + ".", TEAMS[lead].pop));
  }
  if (d.missing.length){
    /* the biggest name to fall out is the one that was best a year ago */
    const lead = d.missing.slice().sort(function(a, b){ return LAST_YEAR[b][0] - LAST_YEAR[a][0]; })[0];
    const rest = d.missing.filter(function(t){ return t !== lead; }).map(function(t){ return TEAMS[t].nick; });
    takes.appendChild(take("Left out in the cold", TEAMS[lead].nick,
      "They went " + LAST_YEAR[lead][0] + "-" + LAST_YEAR[lead][1] + " and made the field last season. You have them at <b>" +
      recStr(R[lead]) + "</b> and home in January" + (rest.length ? ", with " + listOf(rest) : "") + ".",
      TEAMS[lead].pop));
  }
  if (d.champ === LY_CHAMP){
    takes.appendChild(take("Back-to-back", "Seattle repeats",
      "You have the reigning champions going all the way again.", TEAMS[LY_CHAMP].pop, true));
  } else if (d.field[LY_CHAMP] === undefined && R[LY_CHAMP].played){
    takes.appendChild(take("Champions out", "Seattle misses entirely",
      "The reigning champions do not even make your field. Bold.", TEAMS[LY_CHAMP].pop, true));
  }
  takes.appendChild(take("Home cooking", Math.round(d.homePicks / d.called * 100) + "%",
    "How often the home side wins across the " + d.called + " decided games" +
    (filled ? " (yours and filled together)" : "") + "." +
    (d.ties ? " You also predicted " + d.ties + (d.ties === 1 ? " tie." : " ties.") : ""), null));

  wrap.appendChild(el("div", {"class":"sect"}, [
    el("h3", {}, ["The takes"]),
    el("p", {}, ["Measured against how last season actually finished."]),
    takes
  ]));

  /* share card */
  if (d.champ){
    const holder = el("div", {});
    wrap.appendChild(el("div", {"class":"sect"}, [
      el("h3", {}, ["One image for the group chat"]),
      el("p", {}, ["Your bracket, small enough to actually get looked at."]),
      el("div", {"class":"team-tools", style:"margin-top:0"}, [
        el("p", {"class":"hint"}, ["Saves as a PNG, or copies straight to your clipboard."]),
        el("button", {"class":"btn btn-key", onclick:function(){ openCard(S, d); }}, ["Make the card"])
      ]),
      holder
    ]));
  }
  return wrap;
}

async function openCard(S, d){
  showModal([el("h2", {}, ["Building your card…"])]);

  const url = canvas.toDataURL("image/png");
  showModal([
    el("h2", {}, ["Your season, one image"]),
    el("p", {}, ["Save it or copy it, then drop it in the chat before anyone else finishes theirs."]),
    el("img", {"class":"cardprev", src:url, alt:"Your predicted Super Bowl LXI champion and division winners"}),
    el("div", {"class":"sheet-actions"}, [
      el("button", {"class":"btn", onclick:function(){
        canvas.toBlob(function(b){
          const a = document.createElement("a");
          a.download = "pick-em-26" + (state.name ? "-" + state.name.toLowerCase().replace(/[^a-z0-9]+/g, "-") : "") + ".png";
          a.href = URL.createObjectURL(b);
          a.click();
          setTimeout(function(){ URL.revokeObjectURL(a.href); }, 4000);
          toast("Card saved.");
        }, "image/png");
      }}, ["Download"]),
      el("button", {"class":"btn btn-key", onclick:function(){
        canvas.toBlob(function(b){
          if (!navigator.clipboard || !window.ClipboardItem){ toast("Your browser cannot copy images — use Download."); return; }
          navigator.clipboard.write([new ClipboardItem({"image/png":b})])
            .then(function(){ toast("Card copied."); })
            .catch(function(){ toast("Copy was blocked — use Download instead."); });
        }, "image/png");
      }}, ["Copy image"]),
      el("button", {"class":"btn", onclick:closeModal}, ["Done"])
    ])
  ]);
}

async function drawCard(d){
  const W = 1080, H = 1350, P = 74;
  const cv = document.createElement("canvas");
  cv.width = W; cv.height = H;
  const x = cv.getContext("2d");

  try {
    await document.fonts.load('700 100px "Saira Condensed"');
    await document.fonts.load('600 30px "IBM Plex Sans"');
    await document.fonts.load('400 30px "IBM Plex Sans"');
    await document.fonts.ready;
  } catch(e){}

  const t = TEAMS[d.champ];
  const DSP = function(sz){ return '700 ' + sz + 'px "Saira Condensed", sans-serif'; };
  const BDY = function(sz, w){ return (w || 400) + " " + sz + 'px "IBM Plex Sans", sans-serif'; };

  x.fillStyle = "#0A0D12"; x.fillRect(0, 0, W, H);

  const wash = x.createLinearGradient(0, 0, W * 0.85, H * 0.7);
  wash.addColorStop(0, hexA(t.c1, 0.55));
  wash.addColorStop(0.55, hexA(t.c1, 0.06));
  wash.addColorStop(1, "rgba(10,13,18,0)");
  x.fillStyle = wash; x.fillRect(0, 0, W, H);

  /* yard lines */
  x.save();
  x.globalAlpha = 0.07; x.strokeStyle = "#EEF2F8"; x.lineWidth = 2;
  for (let gx = P; gx < W; gx += 68){
    x.beginPath(); x.moveTo(gx, 0); x.lineTo(gx, H); x.stroke();
  }
  x.restore();

  x.textBaseline = "alphabetic";

  /* header */
  x.fillStyle = "#E8B54A"; x.font = BDY(23, 600);
  x.letterSpacing = "5px";
  x.fillText("PICK 'EM · 2026-27 SEASON", P, 108);
  x.letterSpacing = "0px";

  const byline = [state.name ? state.name + "'s call" : "",
                  state.fav && TEAMS[state.fav] ? TEAMS[state.fav].nick + " fan" : ""]
                 .filter(Boolean).join(" · ");
  if (byline){
    x.fillStyle = "#7C879A"; x.font = BDY(27, 400);
    x.fillText(byline, P, 152);
  }

  /* champion */
  x.fillStyle = "#7C879A"; x.font = BDY(22, 600);
  x.letterSpacing = "4px";
  x.fillText("SUPER BOWL LXI CHAMPIONS", P, 296);
  x.letterSpacing = "0px";

  x.fillStyle = t.pop;
  let size = 132;
  x.font = DSP(size);
  while (x.measureText(t.nick.toUpperCase()).width > W - P * 2 && size > 60){
    size -= 4; x.font = DSP(size);
  }
  x.fillStyle = "#EEF2F8"; x.font = DSP(58);
  x.fillText(t.city.toUpperCase(), P, 372);
  x.fillStyle = t.pop; x.font = DSP(size);
  x.fillText(t.nick.toUpperCase(), P, 372 + size * 0.86);

  let y = 372 + size * 0.86 + 58;
  const other = d.champ === d.A.champ ? d.N.champ : d.A.champ;
  x.fillStyle = "#AEB9C8"; x.font = BDY(28, 400);
  x.fillText("over the " + TEAMS[other].name + " · " + recStr(R[d.champ]) + " · " +
             ordinal(d.field[d.champ]) + " seed", P, y);

  /* rule */
  y += 52;
  x.strokeStyle = "#2A3442"; x.lineWidth = 2;
  x.beginPath(); x.moveTo(P, y); x.lineTo(W - P, y); x.stroke();

  /* division winners, two columns */
  y += 52;
  x.fillStyle = "#7C879A"; x.font = BDY(21, 600);
  x.letterSpacing = "4px";
  x.fillText("DIVISION WINNERS", P, y);
  x.letterSpacing = "0px";
  y += 40;

  const colW = (W - P * 2) / 2;
  d.divWinners.forEach(function(dw, i){
    const cx = P + (i % 2) * colW, cy = y + Math.floor(i / 2) * 74;
    const tt = TEAMS[dw.t];
    x.fillStyle = tt.pop; x.fillRect(cx, cy - 4, 5, 40);
    x.fillStyle = "#59636F"; x.font = BDY(17, 600);
    x.letterSpacing = "2px";
    x.fillText(dw.div.toUpperCase(), cx + 20, cy + 12);
    x.letterSpacing = "0px";
    const nick = TEAMS[dw.t].nick.toUpperCase();
    x.fillStyle = "#EEF2F8"; x.font = DSP(31);
    x.fillText(nick, cx + 20, cy + 44);
    x.fillStyle = "#59636F"; x.font = BDY(20, 400);
    x.fillText(recStr(R[dw.t]), cx + 30 + measure(x, DSP(31), nick), cy + 44);
  });
  y += 4 * 74 + 26;

  /* two takes */
  x.strokeStyle = "#2A3442";
  x.beginPath(); x.moveTo(P, y); x.lineTo(W - P, y); x.stroke();
  y += 48;

  const lines = [];
  const riser = d.swings[0], faller = d.swings[d.swings.length - 1];
  if (riser && riser.d > 0) lines.push([TEAMS[riser.t].nick + " +" + riser.d + " wins",
    "up from " + riser.was[0] + "-" + riser.was[1] + " to " + recStr(riser.now)]);
  if (faller && faller.d < 0) lines.push([TEAMS[faller.t].nick + " " + faller.d + " wins",
    "down from " + faller.was[0] + "-" + faller.was[1] + " to " + recStr(faller.now)]);
  if (d.upsets.length) lines.push([d.upsets.length + " seeding upset" + (d.upsets.length === 1 ? "" : "s"),
    "lower seeds advancing in your bracket"]);

  lines.slice(0, 3).forEach(function(L){
    x.fillStyle = "#E8B54A"; x.font = DSP(34);
    x.fillText(L[0].toUpperCase(), P, y);
    x.fillStyle = "#79849A"; x.font = BDY(23, 400);
    x.fillText(L[1], P, y + 32);
    y += 78;
  });

  /* footer */
  const handN = handCount();
  x.fillStyle = "#4E586B"; x.font = BDY(20, 400);
  x.fillText(handN >= NGAMES
    ? "272 games · 18 weeks · every pick made by hand"
    : handN + " of 272 games called by hand · the rest projected", P, H - 62);
  return cv;
}

function measure(ctx, font, text){
  const f = ctx.font; ctx.font = font;
  const w = ctx.measureText(text).width;
  ctx.font = f;
  return w;
}
function hexA(hex, a){
  const c = hexToRgb(hex);
  return "rgba(" + c[0] + "," + c[1] + "," + c[2] + "," + a + ")";
}

/* ─── compare ─── */

function loadRivals(){
  try { return JSON.parse(localStorage.getItem(RKEY) || "[]"); } catch(e){ return []; }
}
function saveRivals(){
  try {
    localStorage.setItem(RKEY, JSON.stringify(rivals.map(function(r){
      return {name:r.name, code:r.code};
    })));
  } catch(e){}
}
function extractCode(text){
  const t = (text || "").trim();
  const m = t.match(/[#&?]p=([A-Za-z0-9\-_%]+)/);
  if (m) return decodeURIComponent(m[1]);
  if (/^[zu][A-Za-z0-9\-_]{8,}$/.test(t)) return t;
  return null;
}
async function addRival(text, fallbackName){
  const code = extractCode(text);
  if (!code) throw new Error("That does not look like a Pick 'Em link.");
  const st = await decodePayload(code);
  if (!st) throw new Error("That link is from a different version and cannot be read.");
  const name = ((fallbackName || st.name || "").trim()) || ("Friend " + (rivals.length + 1));
  const entry = {name:name, code:code, st:st};
  let at = -1;
  rivals.forEach(function(r, i){ if (r.name.toLowerCase() === name.toLowerCase()) at = i; });
  if (at >= 0) rivals[at] = entry; else { rivals.push(entry); at = rivals.length - 1; }
  rivalSel = at;
  saveRivals();
  return entry;
}

  function submit(){

/* ═══ share ═══════════════════════════════════════════════════ */

function serialize(){
  let win = "";
  const scores = [];
  for (let i = 0; i < NGAMES; i++){
    const p = state.picks[i];
    const res = resultOf(i);
    const auto = isAuto(i);
    win += res === "A" ? (auto ? "4" : "1")
         : res === "H" ? (auto ? "5" : "2")
         : res === "T" ? "3" : "0";
    if (p && (p.as != null || p.hs != null)){
      scores.push(i + ":" + (p.as == null ? "" : p.as) + "." + (p.hs == null ? "" : p.hs));
    }
  }
  const po = Object.keys(state.po).map(function(k){ return k + "=" + state.po[k]; });
  return ["2", (state.name || "").replace(/~/g, " ").slice(0, 40), win, scores.join(";"),
          po.join(";"), (state.order.AFC || []).join(","), (state.order.NFC || []).join(","),
          state.fav || ""].join("~");
}

/* v1 links indexed games by their position in a date-sorted schedule, which the
   league's flex scheduling could shift. v2 orders by (week, away, home), which
   cannot drift. A v1 payload would decode to the wrong games, so refuse it
   outright rather than quietly mangle someone's season. */
function deserialize(str){
  const p = str.split("~");
  if (p[0] !== "2") return null;
  const s = blank();
  s.name = p[1] || "";
  const win = p[2] || "";
  for (let i = 0; i < NGAMES; i++){
    const c = win[i];
    if (c === "1") s.picks[i] = {w:"A", as:null, hs:null};
    else if (c === "2") s.picks[i] = {w:"H", as:null, hs:null};
    else if (c === "3") s.picks[i] = {w:null, as:null, hs:null};
    else if (c === "4") s.picks[i] = {w:"A", as:null, hs:null, a:1};
    else if (c === "5") s.picks[i] = {w:"H", as:null, hs:null, a:1};
  }
  (p[3] ? p[3].split(";") : []).forEach(function(bit){
    const m = bit.split(":"), sc = (m[1] || "").split(".");
    const i = +m[0];
    const rec = s.picks[i] = s.picks[i] || {w:null, as:null, hs:null};
    delete rec.a;                              // a scored game is a called game
    rec.as = sc[0] === "" ? null : +sc[0];
    rec.hs = sc[1] === "" ? null : +sc[1];
  });
  (p[4] ? p[4].split(";") : []).forEach(function(bit){
    const m = bit.split("=");
    if (m[0] && m[1]) s.po[m[0]] = m[1];
  });
  s.order.AFC = p[5] ? p[5].split(",").filter(Boolean) : [];
  s.order.NFC = p[6] ? p[6].split(",").filter(Boolean) : [];
  s.fav = (p[7] && TEAMS[p[7]]) ? p[7] : "";   // absent in links made before clubs existed
  return s;
}

function b64u(bytes){
  let s = "";
  for (let i = 0; i < bytes.length; i += 8192){
    s += String.fromCharCode.apply(null, bytes.subarray(i, i + 8192));
  }
  return btoa(s).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
}
function unb64u(s){
  s = s.replace(/-/g, "+").replace(/_/g, "/");
  const bin = atob(s + "===".slice((s.length + 3) % 4));
  const out = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
  return out;
}
async function encodeState(){
  const bytes = new TextEncoder().encode(serialize());
  if (typeof CompressionStream !== "undefined"){
    try {
      const cs = new CompressionStream("deflate-raw");
      const w = cs.writable.getWriter();
      w.write(bytes); w.close();
      const buf = new Uint8Array(await new Response(cs.readable).arrayBuffer());
      return "z" + b64u(buf);
    } catch(e){}
  }
  return "u" + b64u(bytes);
}
async function decodePayload(code){
  const kind = code[0], body = unb64u(code.slice(1));
  if (kind === "z"){
    const ds = new DecompressionStream("deflate-raw");
    const w = ds.writable.getWriter();
    w.write(body); w.close();
    const buf = await new Response(ds.readable).arrayBuffer();
    return deserialize(new TextDecoder().decode(buf));
  }
  return deserialize(new TextDecoder().decode(body));
}

  const code = await encodeState();
  const url = location.origin + location.pathname + location.search + "#p=" + code;

let installEvent = null;
const standalone = window.matchMedia("(display-mode: standalone)").matches ||
                   window.navigator.standalone === true;
const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) ||
              (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);

window.addEventListener("beforeinstallprompt", function(e){
  e.preventDefault();
  installEvent = e;
  renderInstall();
});
window.addEventListener("appinstalled", function(){
  installEvent = null;
  renderInstall();
  toast("Installed. It works offline from here.");
});

function canInstall(){
  /* only the hosted build ships a manifest — the artifact copy must never
     offer to install itself, since that would bookmark the wrong page */
  if (!document.querySelector('link[rel="manifest"]')) return false;
  if (standalone) return false;
  if (installEvent) return true;
  return isIOS && !recall("hideInstall");
}

function renderInstall(){
  const slot = $("#install");
  if (!slot) return;
  slot.innerHTML = "";
  if (!canInstall()) return;
  slot.appendChild(el("button", {"class":"btn", onclick:function(){
    if (installEvent){
      installEvent.prompt();
      installEvent.userChoice.then(function(){ installEvent = null; renderInstall(); });
    } else {
      iosInstallSheet();
    }
  }}, ["Install"]));
}

function iosInstallSheet(){
  showModal([
    el("h2", {}, ["Put it on your home screen"]),
    el("p", {html:"In Safari, tap the <b>Share</b> button, then <b>Add to Home Screen</b>. " +
      "It opens full screen, works with no signal, and keeps your picks."}),
    el("div", {"class":"warn", style:"margin:0 0 18px"}, [
      el("b", {}, ["Worth knowing"]),
      el("span", {}, ["iOS gives a home-screen app its own storage, separate from Safari. " +
        "Picks you have already made in the browser will not appear inside it — " +
        "hit Share first and open your own link once inside the installed app to carry them across."])
    ]),
    el("div", {"class":"sheet-actions"}, [
      el("button", {"class":"btn", onclick:function(){
        remember("hideInstall", "1"); closeModal(); renderInstall();
      }}, ["Don't show this again"]),
      el("button", {"class":"btn btn-key", onclick:closeModal}, ["Got it"])
    ])
  ]);
}

/* ═══ boot ════════════════════════════════════════════════════ */

$("#shareBtn").addEventListener("click", openShare);
/* the rail swaps nicknames for abbreviations below 900px — only re-render
   when that boundary is actually crossed, not on every resize frame */
let narrow = window.innerWidth <= 900;
window.addEventListener("resize", function(){
  const now = window.innerWidth <= 900;
  if (now !== narrow){ narrow = now; render(); }
});

(async function boot(){
  try {
    localStorage.setItem(KEY + ".probe", "1");
    localStorage.removeItem(KEY + ".probe");
  } catch(e){ storageOK = false; }

  load();

  const m = location.hash.match(/[#&]p=([^&]+)/);
  if (m){
    try {
      const s = await decodePayload(decodeURIComponent(m[1]));
      if (s){ state = s; shared = {name:s.name}; }
      else toast("That link was made before the schedule ordering was fixed, so it can no longer be read. Ask for a fresh one.");
    } catch(e){ toast("That share link could not be read."); }
  }

  /* friends' sheets are stored as the same codes the share links carry */
  const saved = loadRivals();
  for (let i = 0; i < saved.length; i++){
    try {
      const st = await decodePayload(saved[i].code);
      if (st) rivals.push({name:saved[i].name, code:saved[i].code, st:st});
    } catch(e){}
  }

  /* open on the week you left off, or the first one with games still to call */
  const w = parseInt(recall("week"), 10);
  if (w >= 1 && w <= 18) weekSel = w;
  else {
    for (let n = 1; n <= 18; n++){
      if (SCHEDULE.some(function(g){ return g.week === n && !resultOf(g.i); })){ weekSel = n; break; }
    }
  }

  const savedScores = recall("scores");
  showScores = savedScores === "1" ? true
             : savedScores === "0" ? false
             : hasAnyScores();          // a shared sheet with scores shows them

  const savedLane = recall("lane");
  lane = (["week","team","mine","totals"].indexOf(savedLane) >= 0)
    ? savedLane : (state.fav && TEAMS[state.fav] ? "mine" : "team");
  if (lane === "mine" && !(state.fav && TEAMS[state.fav])) lane = "team";

  /* land on your own club unless you have deliberately navigated elsewhere */
  const lastTeam = recall("team");
  if (lastTeam && TEAMS[lastTeam]) team = lastTeam;
  else if (state.fav && TEAMS[state.fav]) team = state.fav;

  render();
  renderInstall();
    if ("serviceWorker" in navigator){
    window.addEventListener("load", function(){
      navigator.serviceWorker.register("sw.js").catch(function(){});
    });
    let refreshed = false;
    navigator.serviceWorker.addEventListener("controllerchange", function(){
      if (refreshed) return;
      refreshed = true;
      toast("Updated in the background — reload when you are ready.");
    });
  }

  /* first visit: ask once, before the wall of thirty-two */
  if (!shared && !state.fav && !decidedCount() && !lastTeam) openPicker();
})();
</script>
</body>
</html>
