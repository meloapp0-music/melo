*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0}

:root{
  --pitch:#0A0D12;
  --deck:#141922;
  --deck2:#1B2330;
  --deck3:#232D3C;
  --rule:#2A3442;
  --rule-soft:#1E2733;
  --chalk:#EEF2F8;
  --chalk2:#AEB9C8;
  --chalk3:#79849A;
  --chalk4:#4E586B;
  --brass:#E8B54A;
  --win:#35C98C;
  --loss:#E2555F;
  --team:#E8B54A;
  --team2:#79849A;
  --pop:#E8B54A;
  --pop-ink:#0A0D12;

  --display:"Saira Condensed",ui-sans-serif,system-ui,sans-serif;
  --body:"IBM Plex Sans",ui-sans-serif,system-ui,-apple-system,sans-serif;

  --r:10px;
  --pad:clamp(14px,3vw,24px);
  color-scheme:dark;
}

body{
  background:var(--pitch);
  color:var(--chalk);
  font-family:var(--body);
  font-size:15px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
  font-variant-numeric:tabular-nums;
  overflow-x:hidden;
}

/* ─── shared primitives ─────────────────────────────────────── */
.eyebrow{
  font:600 11px/1 var(--body);
  letter-spacing:.16em;
  text-transform:uppercase;
  color:var(--chalk3);
}
.dsp{font-family:var(--display);font-weight:700;letter-spacing:.005em}
.num{font-family:var(--display);font-weight:700;font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;background:none;border:none;padding:0;cursor:pointer}
input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--pop);outline-offset:2px;border-radius:4px}
.shell{max-width:1220px;margin:0 auto;padding:0 var(--pad)}

/* ─── console bar ───────────────────────────────────────────── */
.console{
  position:sticky;top:0;z-index:60;
  background:linear-gradient(180deg,rgba(10,13,18,.97),rgba(10,13,18,.88));
  backdrop-filter:blur(18px) saturate(1.4);
  -webkit-backdrop-filter:blur(18px) saturate(1.4);
  border-bottom:1px solid var(--rule-soft);
}
.console::after{
  content:"";position:absolute;left:0;right:0;bottom:-1px;height:1px;
  background:linear-gradient(90deg,transparent,var(--team),transparent);
  opacity:.75;transition:background .45s ease;
}
.console-in{display:flex;align-items:center;gap:16px;height:60px}
.mark{display:flex;align-items:baseline;gap:8px;flex-shrink:0}
.mark b{font:700 22px/1 var(--display);letter-spacing:.02em}
.mark span{font:600 10px/1 var(--body);letter-spacing:.2em;color:var(--brass)}
.progress-wrap{flex:1;min-width:0;display:flex;align-items:center;gap:12px}
.bar{flex:1;height:4px;min-width:60px;border-radius:99px;background:var(--deck2);overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--team2),var(--team));transition:width .35s cubic-bezier(.4,0,.2,1),background .45s ease}
.progress-wrap .count{font:700 13px/1 var(--display);color:var(--chalk2);white-space:nowrap;letter-spacing:.03em}
.progress-wrap .count em{font-style:normal;color:var(--chalk4)}
.btn{
  border:1px solid var(--rule);border-radius:8px;padding:7px 13px;
  font:600 12.5px/1 var(--body);color:var(--chalk2);background:var(--deck);
  transition:border-color .18s,color .18s,background .18s;white-space:nowrap;
}
.btn:hover{border-color:var(--chalk4);color:var(--chalk)}
.btn-key{background:var(--pop);color:var(--pop-ink);border-color:transparent;font-weight:600}
.btn-key:hover{background:var(--pop);color:var(--pop-ink);filter:brightness(1.1)}

/* ─── mode tabs ─────────────────────────────────────────────── */
.modes{border-bottom:1px solid var(--rule-soft);background:rgba(10,13,18,.6)}
.modes-in{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.modes-in::-webkit-scrollbar{display:none}
.mode{
  position:relative;padding:13px 2px 11px;margin-right:26px;
  font:600 12px/1 var(--body);letter-spacing:.13em;text-transform:uppercase;
  color:var(--chalk4);transition:color .18s;white-space:nowrap;
}
.mode:hover{color:var(--chalk2)}
.mode[aria-current="true"]{color:var(--chalk)}
.mode[aria-current="true"]::after{
  content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--team);
}
.mode .tick{
  display:inline-block;margin-left:7px;font:700 10px/1 var(--display);
  color:var(--chalk4);letter-spacing:.02em;
}

/* ─── banner (shared picks) ─────────────────────────────────── */
.banner{background:linear-gradient(90deg,rgba(232,181,74,.14),rgba(232,181,74,.04));border-bottom:1px solid rgba(232,181,74,.28)}
.banner.nostore{background:linear-gradient(90deg,rgba(226,85,95,.16),rgba(226,85,95,.05));border-bottom-color:rgba(226,85,95,.4)}
.banner-in{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:11px 0;font-size:13.5px}
.banner b{font-weight:600}
.banner .sp{flex:1}

/* ─── season layout ─────────────────────────────────────────── */
.season{display:grid;grid-template-columns:224px minmax(0,1fr);gap:26px;padding-top:24px;padding-bottom:80px}
/* the week lane and your own club's lane have no rail — one column, capped so
   the pick controls do not drift a screen away from the club they belong to */
.season.solo{grid-template-columns:minmax(0,1fr)}
.season.solo > *{width:100%;max-width:960px;margin:0 auto}
@media (max-width:900px){.season{grid-template-columns:minmax(0,1fr);gap:0;padding-top:0}}

/* team rail */
.rail{position:sticky;top:112px;align-self:start;max-height:calc(100vh - 132px);overflow-y:auto;scrollbar-width:thin;padding-right:4px}
.rail-group{margin-bottom:16px}
.rail-group .eyebrow{padding:0 0 7px 2px;display:block}
.chip{
  display:flex;align-items:center;gap:9px;width:100%;
  padding:6px 9px;border-radius:7px;text-align:left;
  border:1px solid transparent;transition:background .15s,border-color .15s;
}
.chip:hover{background:var(--deck)}
.chip[aria-current="true"]{background:var(--deck2);border-color:var(--rule)}
.chip .flag{width:3px;height:19px;border-radius:2px;flex-shrink:0;background:var(--c)}
.chip .nm{flex:1;min-width:0;font:600 13.5px/1.2 var(--body);color:var(--chalk2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip[aria-current="true"] .nm{color:var(--chalk)}
.chip .rc{font:700 12px/1 var(--display);color:var(--chalk4);letter-spacing:.04em}
.chip[aria-current="true"] .rc,.chip .rc.done{color:var(--c)}

/* mobile rail */
@media (max-width:900px){
  .rail{
    position:sticky;top:100px;max-height:none;overflow-x:auto;overflow-y:hidden;
    display:flex;gap:6px;padding:11px 0;
    margin-left:calc(var(--pad)*-1);margin-right:calc(var(--pad)*-1);
    width:calc(100% + var(--pad)*2);
    padding-left:var(--pad);padding-right:var(--pad);
    background:rgba(10,13,18,.94);backdrop-filter:blur(14px);
    -webkit-backdrop-filter:blur(14px);
    border-bottom:1px solid var(--rule-soft);z-index:50;scrollbar-width:none;
  }
  .rail::-webkit-scrollbar{display:none}
  .rail-group{margin:0;display:flex;gap:6px}
  .rail-group .eyebrow{display:none}
  /* the crest already carries the abbreviation, so the label would only
     repeat it — chips go crest-only and eight fit on screen at once */
  .chip{width:auto;flex-shrink:0;padding:6px;border:1px solid var(--rule-soft);background:var(--deck)}
  .chip[aria-current="true"]{background:color-mix(in srgb,var(--c) 16%,var(--deck));border-color:var(--c)}
  .chip .flag,.chip .nm,.chip .rc{display:none}
  .chip .crest.xs{width:36px;height:36px;border-radius:9px;padding-left:6px;font-size:12.5px}
  .chip .crest.xs::after{right:6px;width:5px}
}

/* ─── team header ───────────────────────────────────────────── */
.thead{
  position:relative;overflow:hidden;border-radius:14px;
  border:1px solid var(--rule-soft);
  background:
    linear-gradient(135deg,color-mix(in srgb,var(--team) 26%,transparent),transparent 62%),
    var(--deck);
  padding:20px 22px;margin-bottom:22px;
}
.thead::before{
  content:"";position:absolute;inset:0;opacity:.5;pointer-events:none;
  background:repeating-linear-gradient(90deg,transparent 0 43px,rgba(238,242,248,.055) 43px 44px);
  -webkit-mask-image:linear-gradient(90deg,transparent,#000 55%);
  mask-image:linear-gradient(90deg,transparent,#000 55%);
}
.thead-in{position:relative;display:flex;align-items:flex-end;gap:20px;flex-wrap:wrap}
.tname{flex:1;min-width:200px}
.tname .city{font:600 12px/1 var(--body);letter-spacing:.18em;text-transform:uppercase;color:var(--chalk3)}
.tname .nick{font:700 clamp(30px,5.4vw,46px)/.96 var(--display);letter-spacing:.01em;margin-top:5px;color:var(--chalk)}
.tname .div{margin-top:8px;font-size:12.5px;color:var(--chalk3)}
.tname .div b{color:var(--team2);font-weight:600}
.readout{text-align:right}
.readout .rec{font:700 clamp(34px,6vw,52px)/1 var(--display);letter-spacing:.01em;color:var(--team)}
.readout .sub{font:600 11px/1 var(--body);letter-spacing:.14em;text-transform:uppercase;color:var(--chalk3);margin-top:6px}
.tmeta{position:relative;display:flex;gap:22px;flex-wrap:wrap;margin-top:18px;padding-top:15px;border-top:1px solid var(--rule-soft)}
.tmeta div{min-width:0}
.tmeta .k{font:600 10px/1 var(--body);letter-spacing:.15em;text-transform:uppercase;color:var(--chalk4)}
.tmeta .v{font:700 16px/1.2 var(--display);color:var(--chalk2);margin-top:5px;letter-spacing:.03em}
@media (max-width:620px){
  .thead{padding:17px 16px;margin-bottom:16px}
  .thead-in{flex-direction:column;align-items:flex-start;gap:11px}
  .tname{min-width:0}
  .readout{text-align:left}
  .readout .sub{margin-top:4px}
  .tmeta{gap:14px 20px;margin-top:14px;padding-top:13px}
}

/* ─── filled-in games read differently from your own calls ──── */
/* yours are solid; filled ones are outlined and dashed, so the sheet never
   pretends you had an opinion you did not have */
.grow.auto::before,.slab.auto::before{
  background:repeating-linear-gradient(180deg,var(--edge) 0 5px,transparent 5px 10px);
}
.grow.auto.won,.grow.auto.lost,.grow.auto.tied{background:var(--deck)}
.grow.auto{border-color:var(--rule-soft)}
.wl button.on.auto{background:transparent;box-shadow:inset 0 0 0 1.5px currentColor}
.wl button.on.auto.w{color:var(--win)}
.wl button.on.auto.l{color:var(--loss)}
.side.won.auto{background:transparent;box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--c) 55%,transparent)}
.grow .fillmark,.slab .fillmark{
  font:600 8.5px/1 var(--body);letter-spacing:.13em;text-transform:uppercase;
  color:var(--chalk4);border:1px solid var(--rule);border-radius:99px;padding:4px 7px;
}

.bar{display:flex}
.bar i.autofill{background:var(--rule);opacity:.85}
.progress-wrap .count .fill{color:var(--chalk4);font-weight:400}

/* ─── win totals lane ───────────────────────────────────────── */
.totbar{
  display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:14px 16px;margin-bottom:18px;
  border:1px solid var(--rule-soft);border-radius:12px;background:var(--deck);
}
.totbar .sum{font:700 22px/1 var(--display);letter-spacing:.02em}
.totbar .sum.off{color:var(--brass)}
.totbar .sum.ok{color:var(--win)}
.totbar .lbl{font:600 10px/1 var(--body);letter-spacing:.14em;text-transform:uppercase;color:var(--chalk4)}
.totbar .note{flex:1;min-width:180px;font-size:12.5px;color:var(--chalk4)}
.totgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:14px}
.totcard{border:1px solid var(--rule-soft);border-radius:12px;background:var(--deck);overflow:hidden}
.totcard h3{
  margin:0;padding:10px 15px;font:600 10.5px/1 var(--body);letter-spacing:.15em;
  text-transform:uppercase;color:var(--chalk3);border-bottom:1px solid var(--rule-soft);background:rgba(0,0,0,.18);
}
.totrow{display:flex;align-items:center;gap:11px;padding:9px 15px;border-top:1px solid var(--rule-soft)}
.totrow:first-of-type{border-top:none}
.totrow .who{flex:1;min-width:0}
.totrow .nm{display:block;font:600 13.5px/1.2 var(--body);color:var(--chalk2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.totrow .was{display:block;font:400 10.5px/1 var(--body);color:var(--chalk4);margin-top:4px}
.totrow .was b{color:var(--chalk3);font-weight:600}
.stepper{display:flex;align-items:center;gap:1px;border:1px solid var(--rule);border-radius:8px;background:var(--pitch);flex-shrink:0}
.stepper button{width:28px;height:30px;font:700 15px/1 var(--display);color:var(--chalk3);transition:background .14s,color .14s}
.stepper button:hover:not(:disabled){background:var(--deck3);color:var(--chalk)}
.stepper button:disabled{opacity:.28;cursor:default}
.stepper .val{min-width:46px;text-align:center;font:700 14px/1 var(--display);letter-spacing:.04em;color:var(--chalk)}
.totrow.locked .nm::after{content:" ·";color:var(--brass)}
.totrow .lock{font:600 9px/1 var(--body);letter-spacing:.1em;text-transform:uppercase;color:var(--brass);white-space:nowrap}

/* ─── your club ─────────────────────────────────────────────── */
.club{
  display:flex;align-items:center;gap:9px;flex-shrink:0;padding:5px 11px 5px 6px;
  border:1px solid var(--rule);border-radius:99px;background:var(--deck);
  transition:border-color .18s;
}
.club:hover{border-color:var(--team)}
.club .txt{display:flex;flex-direction:column;gap:3px;align-items:flex-start}
.club .k{font:600 8.5px/1 var(--body);letter-spacing:.15em;text-transform:uppercase;color:var(--chalk4)}
.club .v{font:700 14px/1 var(--display);letter-spacing:.04em;color:var(--team)}
@media (max-width:760px){
  .club .txt{display:none}
  .club{padding:4px;border-radius:12px}
}
/* the club crest and the Share button both need room on a phone — the raw
   count goes, since the bar and the Season tab's percentage both survive */
@media (max-width:560px){
  .console-in{gap:11px}
  .mark b{font-size:19px}
  .mark span{display:none}
  .progress-wrap .count{display:none}
}

.favcard{
  display:flex;align-items:center;gap:13px;width:100%;text-align:left;
  padding:12px 13px;margin-bottom:16px;border-radius:11px;
  border:1px solid color-mix(in srgb,var(--c) 42%,var(--rule-soft));
  background:linear-gradient(120deg,color-mix(in srgb,var(--c) 17%,var(--deck)),var(--deck) 72%);
  transition:border-color .18s;
}
.favcard:hover{border-color:var(--c)}
.favcard .txt{min-width:0;flex:1}
.favcard .k{display:block;font:600 9px/1 var(--body);letter-spacing:.16em;text-transform:uppercase;color:var(--c)}
.favcard .n{display:block;font:700 17px/1.1 var(--display);color:var(--chalk);margin-top:6px;letter-spacing:.02em}
.favcard .s{display:block;font:400 11px/1 var(--body);color:var(--chalk3);margin-top:6px}
.favcard .rc{font:700 19px/1 var(--display);color:var(--c);letter-spacing:.03em}
@media (max-width:900px){
  .favcard{margin:0 0 2px;padding:9px 11px;gap:10px}
  .favcard .n{font-size:15px;margin-top:4px}
  .favcard .s{display:none}
}

.favbtn{
  display:inline-flex;align-items:center;gap:7px;padding:6px 12px;border-radius:99px;
  border:1px solid var(--rule);background:rgba(0,0,0,.22);
  font:600 11.5px/1 var(--body);color:var(--chalk3);transition:border-color .18s,color .18s;
}
.favbtn:hover{border-color:var(--team);color:var(--chalk)}
.favbtn.on{border-color:var(--team);color:var(--team);background:color-mix(in srgb,var(--team) 13%,transparent)}
.favbtn .st{font-size:12px;line-height:1}

.picker{display:grid;grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:7px;margin:4px 0 6px}
.pick-t{
  display:flex;flex-direction:column;align-items:center;gap:7px;padding:9px 4px;
  border:1px solid var(--rule-soft);border-radius:10px;background:var(--deck);
  transition:border-color .16s,background .16s;
}
.pick-t:hover{border-color:var(--chalk4);background:var(--deck2)}
.pick-t .n{font:600 10.5px/1.1 var(--body);color:var(--chalk3);text-align:center}
.pick-conf{font:600 10px/1 var(--body);letter-spacing:.16em;text-transform:uppercase;color:var(--chalk4);margin:14px 0 9px}
.pick-conf:first-child{margin-top:0}
tr.fav td{background:color-mix(in srgb,var(--team) 11%,transparent)}
tr.fav td:first-child{box-shadow:inset 3px 0 0 var(--team)}
.seedrow.fav{background:color-mix(in srgb,var(--team) 9%,transparent)}

/* ─── crest ─────────────────────────────────────────────────── */
/* a club's own two colours, its abbreviation, and a helmet stripe — enough
   identity to recognise at a glance without borrowing anyone's trademark */
.crest{
  position:relative;flex-shrink:0;overflow:hidden;
  display:inline-flex;align-items:center;justify-content:flex-start;
  width:42px;height:42px;border-radius:10px;padding-left:7px;
  background:var(--c1);border:1px solid rgba(255,255,255,.1);
  font:700 14px/1 var(--display);letter-spacing:.02em;
}
.crest::after{
  content:"";position:absolute;top:-2px;bottom:-2px;right:8px;width:6px;
  background:var(--c2);transform:skewX(-12deg);opacity:.95;
}
.crest span{position:relative;z-index:1}
.crest.xs{width:28px;height:28px;border-radius:7px;padding-left:4px;font-size:10.5px}
.crest.xs::after{right:4px;width:4px}
.crest.sm{width:34px;height:34px;border-radius:8px;padding-left:5px;font-size:12px}
.crest.sm::after{right:6px;width:5px}
.crest.lg{width:78px;height:78px;border-radius:17px;padding-left:12px;font-size:25px}
.crest.lg::after{right:14px;width:11px}

/* ─── team lane: one row per game, called W or L ─────────────── */
.grow{
  position:relative;overflow:hidden;display:flex;align-items:center;gap:14px;
  flex-wrap:wrap;padding:11px 15px;border:1px solid var(--rule-soft);
  border-radius:var(--r);background:var(--deck);
  transition:border-color .2s,background .25s;
}
.grow::before{
  content:"";position:absolute;left:0;top:0;bottom:0;width:4px;
  background:var(--edge,transparent);transition:background .25s;
}
.grow.won{background:linear-gradient(90deg,color-mix(in srgb,var(--win) 13%,var(--deck)),var(--deck) 46%);border-color:color-mix(in srgb,var(--win) 26%,var(--rule-soft))}
.grow.lost{background:linear-gradient(90deg,color-mix(in srgb,var(--loss) 13%,var(--deck)),var(--deck) 46%);border-color:color-mix(in srgb,var(--loss) 26%,var(--rule-soft))}
.grow.tied{background:linear-gradient(90deg,color-mix(in srgb,var(--brass) 12%,var(--deck)),var(--deck) 46%)}
.grow.cursor{border-color:var(--pop);box-shadow:0 0 0 1px var(--pop)}
.grow .opp{display:flex;align-items:center;gap:12px;flex:1;min-width:150px}
.grow .otxt{min-width:0}
.grow .ha{display:block;font:600 10px/1 var(--body);letter-spacing:.15em;text-transform:uppercase;color:var(--chalk4)}
.grow .onm{display:block;font:600 15.5px/1.2 var(--body);color:var(--chalk);margin-top:5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.grow .ometa{display:block;font:400 11.5px/1 var(--body);color:var(--chalk4);margin-top:5px}
.grow .ometa .intl{color:var(--brass);font-weight:600}
.wl{display:flex;gap:3px;padding:3px;border:1px solid var(--rule);border-radius:10px;background:var(--pitch);flex-shrink:0}
.wl button{
  width:46px;padding:9px 0;border-radius:7px;text-align:center;
  font:700 15px/1 var(--display);letter-spacing:.08em;color:var(--chalk4);
  transition:background .16s,color .16s;
}
.wl button:hover{color:var(--chalk);background:var(--deck2)}
.wl button.on.w{background:var(--win);color:#052015}
.wl button.on.l{background:var(--loss);color:#2B0509}
.grow .tiechip{
  font:700 10px/1 var(--display);letter-spacing:.1em;color:var(--brass);
  border:1px solid rgba(232,181,74,.4);border-radius:99px;padding:5px 9px;
}
.grow .scores{display:flex;align-items:center;gap:5px;flex-shrink:0}
.grow .scores .lbl{font:600 9px/1 var(--body);letter-spacing:.1em;text-transform:uppercase;color:var(--chalk4)}
.sc.mini{
  width:44px;height:34px;align-self:auto;border-radius:8px;font-size:17px;
  border:1px solid var(--rule);
}
.sc.mini:focus{box-shadow:none;border-color:var(--pop)}
@media (max-width:560px){
  .grow{gap:10px;padding:11px 12px}
  .grow .opp{min-width:100%}
  .wl button{width:52px}
}

/* ─── game slabs ────────────────────────────────────────────── */
.slabs{display:flex;flex-direction:column;gap:7px}
.wkrow{display:grid;grid-template-columns:52px minmax(0,1fr);gap:12px;align-items:stretch}
@media (max-width:560px){.wkrow{grid-template-columns:38px minmax(0,1fr);gap:8px}}
.wk{padding-top:13px;text-align:right}
.wk .n{font:700 20px/1 var(--display);color:var(--chalk4);letter-spacing:.02em}
.wk .d{font:600 10px/1.3 var(--body);color:var(--chalk4);margin-top:3px;letter-spacing:.04em}

.slab{
  position:relative;border:1px solid var(--rule-soft);border-radius:var(--r);
  background:var(--deck);overflow:hidden;transition:border-color .2s;
}
.slab::before{
  content:"";position:absolute;left:0;top:0;bottom:0;width:3px;
  background:var(--edge,transparent);transition:background .25s;
}
.slab.decided{border-color:var(--rule)}
.slab-in{display:grid;grid-template-columns:minmax(0,1fr) 40px minmax(0,1fr);align-items:stretch}
.half{display:flex;align-items:stretch;min-width:0}
.half.home{flex-direction:row-reverse}
.side{
  flex:1;display:flex;align-items:center;gap:10px;padding:12px 13px;min-width:0;
  transition:background .18s,opacity .2s;text-align:left;
}
.side.home{flex-direction:row-reverse;text-align:right}
.side:hover{background:var(--deck2)}
.side .dot{width:8px;height:8px;border-radius:2px;background:var(--c);flex-shrink:0;transition:opacity .2s}
.side .who{min-width:0;flex:1}
.side .ab{font:700 17px/1 var(--display);letter-spacing:.04em;color:var(--chalk2);transition:color .2s}
.side .fn{font:400 11px/1.2 var(--body);color:var(--chalk4);margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media (max-width:620px){.side .fn .nk{display:none}}
.side.won .ab{color:var(--c)}
.side.won{background:color-mix(in srgb,var(--c) 12%,transparent)}
.side.lost{opacity:.42}
.side.lost .dot{opacity:.3}
.at{
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  font:600 10px/1 var(--body);color:var(--chalk4);letter-spacing:.1em;
  border-left:1px solid var(--rule-soft);border-right:1px solid var(--rule-soft);
}
.at .tie{font:700 9px/1 var(--display);color:var(--brass);letter-spacing:.08em}
.slab-foot{
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  padding:7px 13px;border-top:1px solid var(--rule-soft);background:rgba(0,0,0,.16);
}
.slab-foot .when{font:400 11.5px/1.35 var(--body);color:var(--chalk4);flex:1;min-width:0}
.slab-foot .intl{color:var(--brass);font-weight:600}
.slab-foot .nudge-hint{font:600 9.5px/1 var(--body);letter-spacing:.11em;text-transform:uppercase;color:var(--chalk4);opacity:.7}
.sc{
  width:46px;flex-shrink:0;align-self:stretch;padding:0 2px;text-align:center;
  background:transparent;border:none;border-radius:0;
  font:700 21px/1 var(--display);letter-spacing:.02em;color:var(--chalk4);
  transition:color .16s,background .16s;-moz-appearance:textfield;
}
.sc::-webkit-outer-spin-button,.sc::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.sc::placeholder{color:var(--chalk4);opacity:.45}
.sc:hover{background:rgba(255,255,255,.03);color:var(--chalk3)}
.sc:focus{background:var(--deck2);color:var(--chalk);outline:none;box-shadow:inset 0 -2px 0 var(--pop)}
.sc.set{color:var(--chalk2)}
.slab.decided .sc.set{color:var(--chalk)}

.bye{
  display:flex;align-items:center;gap:12px;padding:11px 14px;
  border:1px dashed var(--rule);border-radius:var(--r);
  background:repeating-linear-gradient(135deg,transparent 0 7px,rgba(238,242,248,.022) 7px 14px);
}
.bye .lbl{font:700 13px/1 var(--display);letter-spacing:.18em;color:var(--chalk4)}
.bye .txt{font-size:12.5px;color:var(--chalk4)}

.team-tools{display:flex;gap:8px;align-items:center;margin-top:18px;flex-wrap:wrap}
.hint{font-size:12.5px;color:var(--chalk4);flex:1;min-width:180px}

/* ─── standings ─────────────────────────────────────────────── */
.pane{padding-top:26px;padding-bottom:80px}
.pane-head{margin-bottom:22px;max-width:60ch}
.pane-head h2{font:700 clamp(24px,4vw,34px)/1.05 var(--display);margin:0 0 8px;letter-spacing:.01em}
.pane-head p{margin:0;color:var(--chalk3);font-size:14px}
.warn{
  display:flex;gap:10px;align-items:baseline;margin:16px 0 0;padding:11px 14px;
  border-radius:9px;border:1px solid rgba(232,181,74,.3);background:rgba(232,181,74,.07);
  font-size:13px;color:var(--chalk2);
}
.warn b{color:var(--brass);font-weight:600;white-space:nowrap}

.divgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(310px,1fr));gap:14px}
.divcard{border:1px solid var(--rule-soft);border-radius:12px;background:var(--deck);overflow:hidden}
.divcard h3{
  margin:0;padding:11px 15px;font:600 11px/1 var(--body);letter-spacing:.16em;
  text-transform:uppercase;color:var(--chalk3);border-bottom:1px solid var(--rule-soft);
  background:rgba(0,0,0,.18);
}
table{width:100%;border-collapse:collapse}
.tbl-wrap{overflow-x:auto}
th{
  font:600 9.5px/1 var(--body);letter-spacing:.12em;text-transform:uppercase;
  color:var(--chalk4);text-align:right;padding:9px 8px 7px;font-weight:600;
}
th:first-child{text-align:left;padding-left:15px}
td{padding:8px;border-top:1px solid var(--rule-soft);text-align:right;font:600 13px/1 var(--display);letter-spacing:.03em;color:var(--chalk2);white-space:nowrap}
td:first-child{text-align:left;padding-left:15px}
.tm{display:flex;align-items:center;gap:9px}
.tm .flag{width:3px;height:16px;border-radius:2px;background:var(--c);flex-shrink:0}
.tm button{font:600 13.5px/1.2 var(--body);color:var(--chalk);text-align:left}
.tm button:hover{color:var(--c)}
.tm .sd{font:700 10px/1 var(--display);color:var(--pitch);background:var(--brass);border-radius:3px;padding:3px 4px;min-width:16px;text-align:center;letter-spacing:0}
.tm .sd.wc{background:var(--chalk3)}
tr.clinch td{background:rgba(232,181,74,.05)}

/* seeds */
.seedgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:18px;margin-top:26px}
.seedcard{border:1px solid var(--rule-soft);border-radius:12px;background:var(--deck);overflow:hidden}
.seedcard > h3{margin:0;padding:13px 16px;font:700 15px/1 var(--display);letter-spacing:.1em;border-bottom:1px solid var(--rule-soft);background:rgba(0,0,0,.18)}
.seedrow{display:flex;align-items:center;gap:11px;padding:9px 16px;border-top:1px solid var(--rule-soft)}
.seedrow:first-of-type{border-top:none}
.seedrow.gap{border-top:1px solid var(--rule);background:rgba(0,0,0,.16)}
.seedrow .sn{font:700 15px/1 var(--display);color:var(--chalk4);width:16px;flex-shrink:0}
.seedrow.in .sn{color:var(--brass)}
.seedrow .flag{width:3px;height:19px;border-radius:2px;background:var(--c);flex-shrink:0}
.seedrow .nm{flex:1;min-width:0;font:600 14px/1.2 var(--body);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.seedrow .rc{font:700 13px/1 var(--display);color:var(--chalk2);letter-spacing:.04em}
.seedrow .why{font:400 10.5px/1 var(--body);color:var(--chalk4);white-space:nowrap}
.seedrow .why.manual{color:var(--brass)}
.nudge{display:flex;flex-direction:column;gap:1px}
.nudge button{
  width:19px;height:13px;display:flex;align-items:center;justify-content:center;
  border-radius:3px;color:var(--chalk4);font-size:8px;line-height:1;transition:color .15s,background .15s;
}
.nudge button:hover:not(:disabled){color:var(--chalk);background:var(--deck3)}
.nudge button:disabled{opacity:.2;cursor:default}

/* ─── bracket ───────────────────────────────────────────────── */
.confblock{margin-bottom:34px}
.confblock > h3{
  font:700 20px/1 var(--display);letter-spacing:.14em;margin:0 0 14px;
  padding-bottom:10px;border-bottom:1px solid var(--rule-soft);
}
.rounds{display:grid;grid-template-columns:repeat(3,minmax(232px,1fr));gap:16px;min-width:min-content}
@media (max-width:820px){.rounds{grid-template-columns:1fr}}
.round{display:flex;flex-direction:column;gap:12px}
.round > .eyebrow{margin-bottom:-2px;flex-shrink:0}
.round-mus{display:flex;flex-direction:column;gap:12px;flex:1;justify-content:center}
@media (max-width:820px){.round-mus{justify-content:flex-start}}
.mu{border:1px solid var(--rule-soft);border-radius:10px;background:var(--deck);overflow:hidden}
.mu.pending{border-style:dashed;opacity:.55}
.mu .slot{display:flex;align-items:center;gap:10px;padding:11px 13px;width:100%;text-align:left;transition:background .16s}
.mu .slot + .slot{border-top:1px solid var(--rule-soft)}
.mu .slot:hover:not(:disabled){background:var(--deck2)}
.mu .slot .sn{font:700 12px/1 var(--display);color:var(--chalk4);width:14px;flex-shrink:0}
.mu .slot .flag{width:3px;height:18px;border-radius:2px;background:var(--c);flex-shrink:0}
.mu .slot .nm{flex:1;min-width:0;font:600 13.5px/1.2 var(--body);color:var(--chalk2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mu .slot .rc{font:700 11.5px/1 var(--display);color:var(--chalk4);letter-spacing:.04em}
.mu .slot.adv{background:color-mix(in srgb,var(--c) 13%,transparent)}
.mu .slot.adv .nm{color:var(--chalk)}
.mu .slot.adv .sn{color:var(--c)}
.mu .slot.out{opacity:.4}
.mu .slot.empty{color:var(--chalk4);font-size:13px;justify-content:center;padding:15px}
.mu .tag{padding:6px 13px;border-top:1px solid var(--rule-soft);background:rgba(0,0,0,.18);font:600 9.5px/1 var(--body);letter-spacing:.13em;text-transform:uppercase;color:var(--chalk4)}
.byecard{border:1px dashed var(--rule);border-radius:10px;padding:13px;background:repeating-linear-gradient(135deg,transparent 0 7px,rgba(238,242,248,.022) 7px 14px)}
.byecard .eyebrow{color:var(--brass)}
.byecard .nm{font:700 16px/1.2 var(--display);margin-top:6px;color:var(--chalk)}

.sb{
  margin-top:8px;border:1px solid rgba(232,181,74,.32);border-radius:14px;overflow:hidden;
  background:linear-gradient(160deg,rgba(232,181,74,.11),rgba(232,181,74,.02) 55%),var(--deck);
}
.sb-head{padding:17px 20px 14px;text-align:center;border-bottom:1px solid rgba(232,181,74,.2)}
.sb-head .eyebrow{color:var(--brass)}
.sb-head h3{font:700 clamp(26px,4.6vw,38px)/1 var(--display);letter-spacing:.03em;margin:7px 0 0}
.sb-head .loc{font-size:12.5px;color:var(--chalk3);margin-top:7px}
.sb-body{display:grid;grid-template-columns:1fr auto 1fr;align-items:stretch}
@media (max-width:600px){.sb-body{grid-template-columns:1fr}}
.sb-side{display:flex;flex-direction:column;align-items:center;gap:9px;padding:22px 16px;text-align:center;transition:background .18s}
.sb-side:hover:not(:disabled){background:rgba(255,255,255,.03)}
.sb-side .flag{width:34px;height:3px;border-radius:2px;background:var(--c)}
.sb-side .cf{font:600 10px/1 var(--body);letter-spacing:.16em;text-transform:uppercase;color:var(--chalk4)}
.sb-side .nm{font:700 clamp(19px,3.4vw,27px)/1.05 var(--display);color:var(--chalk2)}
.sb-side .rc{font:400 11.5px/1 var(--body);color:var(--chalk4)}
.sb-side.champ .nm{color:var(--c)}
.sb-side.champ{background:color-mix(in srgb,var(--c) 11%,transparent)}
.sb-side.out{opacity:.38}
.sb-v{display:flex;align-items:center;justify-content:center;padding:0 14px;font:700 13px/1 var(--display);color:var(--chalk4);letter-spacing:.1em;border-left:1px solid var(--rule-soft);border-right:1px solid var(--rule-soft)}
@media (max-width:600px){.sb-v{border:none;border-top:1px solid var(--rule-soft);border-bottom:1px solid var(--rule-soft);padding:8px}}
.champline{padding:15px 20px;text-align:center;border-top:1px solid rgba(232,181,74,.2);background:rgba(232,181,74,.06)}
.champline .eyebrow{color:var(--brass)}
.champline .nm{font:700 clamp(22px,4vw,32px)/1.1 var(--display);margin-top:6px;color:var(--c)}

/* ─── sheet ─────────────────────────────────────────────────── */
.scrim{position:fixed;inset:0;z-index:100;background:rgba(6,8,11,.72);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;padding:var(--pad)}
.sheet{width:min(480px,100%);max-height:88vh;overflow-y:auto;border:1px solid var(--rule);border-radius:16px;background:var(--deck);padding:24px}
.sheet h2{font:700 24px/1.05 var(--display);margin:0 0 8px;letter-spacing:.01em}
.sheet p{margin:0 0 18px;color:var(--chalk3);font-size:13.5px}
.field{margin-bottom:16px}
.field label{display:block;font:600 10px/1 var(--body);letter-spacing:.14em;text-transform:uppercase;color:var(--chalk4);margin-bottom:7px}
.field input[type=text]{width:100%;padding:10px 12px;border:1px solid var(--rule);border-radius:8px;background:var(--pitch);font-size:14px}
.field input[type=text]:focus{outline:none;border-color:var(--pop)}
.linkbox{display:flex;gap:8px}
.linkbox input{flex:1;min-width:0;padding:10px 12px;border:1px solid var(--rule);border-radius:8px;background:var(--pitch);font:400 12px/1.3 var(--body);color:var(--chalk3)}
.sheet-actions{display:flex;gap:9px;justify-content:flex-end;margin-top:22px;flex-wrap:wrap}
.danger{color:var(--loss);border-color:rgba(226,85,95,.4)}
.danger:hover{color:var(--loss);border-color:var(--loss);background:rgba(226,85,95,.08)}

.footer{border-top:1px solid var(--rule-soft);padding:22px 0 40px;font-size:12px;color:var(--chalk4);line-height:1.65}
.footer a{color:var(--chalk3)}

/* ─── lane bar + week lane ──────────────────────────────────── */
.lanebar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:18px 0 4px}
.seg{display:flex;padding:3px;gap:2px;border:1px solid var(--rule);border-radius:9px;background:var(--deck)}
.seg button{
  padding:6px 14px;border-radius:6px;font:600 12.5px/1 var(--body);
  color:var(--chalk3);transition:background .16s,color .16s;
}
.seg button:hover{color:var(--chalk2)}
.seg button[aria-current="true"]{background:var(--deck3);color:var(--chalk)}
.switch{
  display:inline-flex;align-items:center;gap:8px;flex-shrink:0;
  padding:6px 12px 6px 8px;border:1px solid var(--rule);border-radius:99px;
  background:var(--deck);font:600 11.5px/1 var(--body);color:var(--chalk3);
  transition:border-color .16s,color .16s;
}
.switch:hover{border-color:var(--chalk4);color:var(--chalk2)}
.switch[aria-pressed="true"]{color:var(--chalk);border-color:color-mix(in srgb,var(--team) 45%,var(--rule))}
.switch .track{
  position:relative;flex-shrink:0;width:26px;height:15px;border-radius:99px;
  background:var(--deck3);transition:background .18s;
}
.switch[aria-pressed="true"] .track{background:var(--team)}
.switch .knob{
  position:absolute;top:2px;left:2px;width:11px;height:11px;border-radius:99px;
  background:var(--chalk3);transition:transform .18s,background .18s;
}
.switch[aria-pressed="true"] .knob{transform:translateX(11px);background:var(--pitch)}

.kbd{display:flex;align-items:center;gap:7px;font:400 11.5px/1 var(--body);color:var(--chalk4)}
.kbd b{
  display:inline-block;min-width:19px;padding:4px 5px;text-align:center;
  border:1px solid var(--rule);border-radius:5px;background:var(--deck);
  font:600 10.5px/1 var(--body);color:var(--chalk3);
}
@media (max-width:720px){.kbd{display:none}}

.weekbar{
  display:flex;gap:5px;overflow-x:auto;scrollbar-width:none;
  padding:14px 0 16px;margin-bottom:4px;
}
.weekbar::-webkit-scrollbar{display:none}
.wkchip{
  flex-shrink:0;display:flex;flex-direction:column;align-items:center;gap:4px;
  min-width:52px;padding:8px 9px;border-radius:8px;border:1px solid var(--rule-soft);
  background:var(--deck);transition:border-color .16s,background .16s;
}
.wkchip:hover{border-color:var(--chalk4)}
.wkchip[aria-current="true"]{border-color:var(--team);background:color-mix(in srgb,var(--team) 14%,var(--deck))}
.wkchip .n{font:700 15px/1 var(--display);color:var(--chalk2);letter-spacing:.03em}
.wkchip[aria-current="true"] .n{color:var(--chalk)}
.wkchip .dots{display:flex;gap:2px}
.wkchip .dots i{width:3px;height:3px;border-radius:99px;background:var(--chalk4);opacity:.45}
.wkchip .dots i.on{background:var(--team);opacity:1}
.daygroup{margin:20px 0 9px;display:flex;align-items:center;gap:12px}
.daygroup .lbl{font:600 10.5px/1 var(--body);letter-spacing:.15em;text-transform:uppercase;color:var(--chalk3);white-space:nowrap}
.daygroup .ln{flex:1;height:1px;background:var(--rule-soft)}
.slab.cursor{border-color:var(--pop)}
.slab.cursor::after{
  content:"";position:absolute;inset:-1px;border-radius:var(--r);pointer-events:none;
  box-shadow:0 0 0 1px var(--pop);
}
.byelist{
  margin-top:22px;padding:13px 15px;border:1px dashed var(--rule);border-radius:var(--r);
  font-size:12.5px;color:var(--chalk4);line-height:1.7;
}
.byelist b{color:var(--chalk3);font-weight:600;letter-spacing:.14em;text-transform:uppercase;font-size:10px;display:block;margin-bottom:5px}

/* ─── compare ───────────────────────────────────────────────── */
.rivalbar{display:flex;gap:7px;flex-wrap:wrap;align-items:center;margin-bottom:22px}
.rvchip{
  display:flex;align-items:center;gap:9px;padding:8px 13px;border-radius:9px;
  border:1px solid var(--rule-soft);background:var(--deck);transition:border-color .16s;
}
.rvchip:hover{border-color:var(--chalk4)}
.rvchip[aria-current="true"]{border-color:var(--pop);background:var(--deck2)}
.rvchip .nm{font:600 13.5px/1 var(--body);color:var(--chalk2)}
.rvchip[aria-current="true"] .nm{color:var(--chalk)}
.rvchip .pc{font:700 12px/1 var(--display);color:var(--chalk4);letter-spacing:.04em}
.rvchip .x{color:var(--chalk4);font-size:14px;line-height:1;padding:0 1px}
.rvchip .x:hover{color:var(--loss)}

.agree{
  display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:1px;
  border:1px solid var(--rule-soft);border-radius:12px;overflow:hidden;background:var(--rule-soft);
}
.agree > div{background:var(--deck);padding:17px 18px}
.agree .k{font:600 10px/1 var(--body);letter-spacing:.14em;text-transform:uppercase;color:var(--chalk4)}
.agree .v{font:700 clamp(24px,4vw,32px)/1 var(--display);margin-top:8px;letter-spacing:.02em}
.agree .s{font-size:12px;color:var(--chalk4);margin-top:6px}

.gaps{margin-top:26px}
.gaprow{display:grid;grid-template-columns:132px minmax(0,1fr) 132px;align-items:center;gap:10px;padding:7px 0;border-top:1px solid var(--rule-soft)}
.gaprow:first-of-type{border-top:none}
.gaprow .gs{display:flex;align-items:center;gap:8px;min-width:0}
.gaprow .gs.r{flex-direction:row-reverse}
.gaprow .gs .flag{width:3px;height:17px;border-radius:2px;background:var(--c);flex-shrink:0}
.gaprow .rec{font:700 14px/1 var(--display);letter-spacing:.04em;white-space:nowrap}
.gaprow .tmn{font:600 12.5px/1 var(--body);color:var(--chalk3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gapbar{position:relative;height:22px;display:flex;align-items:center;justify-content:center}
.gapbar .mid{position:absolute;top:0;bottom:0;width:1px;background:var(--rule);left:50%}
.gapbar i{position:absolute;height:6px;border-radius:99px;background:var(--c)}
.gapbar .d{position:relative;font:700 11px/1 var(--display);color:var(--chalk4);background:var(--pitch);padding:0 6px;letter-spacing:.04em}
.gaprow.gaphead{padding-bottom:3px}
.gaprow.gaphead .tmn,.gaprow.gaphead .d,.gaprow.gaphead .rec{
  font:600 9.5px/1 var(--body);letter-spacing:.13em;text-transform:uppercase;color:var(--chalk4);
}
.gaprow.gaphead .gapbar{height:auto}
@media (max-width:620px){
  .gaprow{grid-template-columns:1fr auto 1fr;gap:8px}
  .gaprow .tmn{display:none}
  .gapbar{min-width:60px}
}

.splits{margin-top:26px}
.splithead{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.splithead select{
  padding:7px 11px;border:1px solid var(--rule);border-radius:8px;background:var(--deck);
  font:600 12.5px/1 var(--body);color:var(--chalk2);
}
.splitrow{
  display:grid;grid-template-columns:56px minmax(0,1fr);gap:12px;align-items:center;
  padding:9px 0;border-top:1px solid var(--rule-soft);
}
.splitrow .wk{font:700 12px/1 var(--display);color:var(--chalk4);text-align:right;padding:0;letter-spacing:.04em}
.splitrow .mt{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px;color:var(--chalk3)}
.splitrow .pk{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:99px;border:1px solid var(--rule);background:var(--deck)}
.splitrow .pk .flag{width:3px;height:12px;border-radius:2px;background:var(--c)}
.splitrow .pk b{font:700 12px/1 var(--display);color:var(--c);letter-spacing:.04em}
.splitrow .pk span{font-size:10.5px;color:var(--chalk4)}
.splitrow .gm{font:600 12.5px/1 var(--body);color:var(--chalk4);white-space:nowrap}
.morebtn{margin-top:14px}

.vsgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px;margin-top:26px}
.vscard{border:1px solid var(--rule-soft);border-radius:12px;background:var(--deck);overflow:hidden}
.vscard h4{margin:0;padding:11px 15px;font:600 10.5px/1 var(--body);letter-spacing:.15em;text-transform:uppercase;color:var(--chalk3);border-bottom:1px solid var(--rule-soft);background:rgba(0,0,0,.18)}
.vsrow{display:grid;grid-template-columns:18px minmax(0,1fr) minmax(0,1fr);gap:9px;align-items:center;padding:7px 15px;border-top:1px solid var(--rule-soft)}
.vsrow:first-of-type{border-top:none}
.vsrow .sn{font:700 11px/1 var(--display);color:var(--chalk4)}
.vsrow .c{display:flex;align-items:center;gap:7px;min-width:0}
.vsrow .c .flag{width:3px;height:14px;border-radius:2px;background:var(--c);flex-shrink:0}
.vsrow .c span{font:600 12.5px/1.2 var(--body);color:var(--chalk3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vsrow.same .c span{color:var(--chalk2)}
.vsrow:not(.same){background:rgba(232,181,74,.05)}
.vsrow:not(.same) .c span{color:var(--chalk)}

/* ─── receipts ──────────────────────────────────────────────── */
.rc-hero{
  position:relative;overflow:hidden;border-radius:16px;border:1px solid var(--rule-soft);
  background:linear-gradient(150deg,color-mix(in srgb,var(--c) 30%,transparent),transparent 60%),var(--deck);
  padding:clamp(24px,5vw,44px);text-align:center;
}
.rc-hero::before{
  content:"";position:absolute;inset:0;opacity:.4;pointer-events:none;
  background:repeating-linear-gradient(90deg,transparent 0 47px,rgba(238,242,248,.05) 47px 48px);
  -webkit-mask-image:radial-gradient(ellipse at center,#000,transparent 72%);
  mask-image:radial-gradient(ellipse at center,#000,transparent 72%);
}
.rc-hero > *{position:relative}
.rc-hero .eyebrow{color:var(--brass)}
.rc-hero .who{font:700 clamp(34px,8vw,68px)/.95 var(--display);letter-spacing:.01em;margin:12px 0 0;color:var(--c)}
.rc-hero .line{margin-top:14px;font-size:13.5px;color:var(--chalk3)}
.rc-hero .line b{color:var(--chalk2);font-weight:600}
.rc-empty{text-align:center;padding:clamp(30px,7vw,60px);border:1px dashed var(--rule);border-radius:16px;color:var(--chalk3)}
.rc-empty h3{font:700 22px/1.15 var(--display);color:var(--chalk2);margin:0 0 8px}

.takes{display:grid;grid-template-columns:repeat(auto-fit,minmax(248px,1fr));gap:12px;margin-top:22px}
.take{border:1px solid var(--rule-soft);border-radius:12px;background:var(--deck);padding:16px 17px;position:relative;overflow:hidden}
.take::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--c,var(--rule))}
.take .k{font:600 10px/1 var(--body);letter-spacing:.15em;text-transform:uppercase;color:var(--chalk4)}
.take .v{font:700 clamp(19px,3vw,24px)/1.1 var(--display);margin-top:9px;color:var(--chalk)}
.take .s{font-size:12.5px;color:var(--chalk3);margin-top:7px;line-height:1.5}
.take.hot::before{background:var(--brass)}

.champs8{display:grid;grid-template-columns:repeat(auto-fit,minmax(196px,1fr));gap:9px;margin-top:14px}
.champ8{display:flex;align-items:center;gap:10px;padding:10px 13px;border:1px solid var(--rule-soft);border-radius:9px;background:var(--deck)}
.champ8 .flag{width:3px;height:20px;border-radius:2px;background:var(--c);flex-shrink:0}
.champ8 .d{display:block;font:600 9.5px/1 var(--body);letter-spacing:.13em;text-transform:uppercase;color:var(--chalk4)}
.champ8 .n{display:block;font:600 13.5px/1.2 var(--body);color:var(--chalk2);margin-top:5px}
.champ8 .r{margin-left:auto;font:700 12.5px/1 var(--display);color:var(--chalk4);letter-spacing:.04em}
.sect{margin-top:34px}
.sect > h3{font:700 19px/1 var(--display);letter-spacing:.06em;margin:0 0 4px}
.sect > p{margin:0 0 14px;font-size:13px;color:var(--chalk4)}
.cardprev{width:100%;border-radius:12px;border:1px solid var(--rule);display:block}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms !important;transition-duration:.01ms !important}
}
</style>

/* lighten a hex until it reads against the near-black ground */
function readable(hex){
  let c = hexToRgb(hex);
  let guard = 0;
  while (contrast(c, [10,13,18]) < 4.6 && guard++ < 60){
    c = c.map(function(v){ return Math.min(255, v + 6 + v * 0.055); });
  }
  return rgbToHex(c);
}
function hexToRgb(h){
  h = h.replace("#","");
  return [parseInt(h.slice(0,2),16), parseInt(h.slice(2,4),16), parseInt(h.slice(4,6),16)];
}
function rgbToHex(c){
  return "#" + c.map(function(v){
    return Math.round(Math.max(0, Math.min(255, v))).toString(16).padStart(2,"0");
  }).join("");
}
function lum(c){
  const s = c.map(function(v){
    v /= 255; return v <= 0.03928 ? v/12.92 : Math.pow((v+0.055)/1.055, 2.4);
  });
  return 0.2126*s[0] + 0.7152*s[1] + 0.0722*s[2];
}
function contrast(a, b){
  const la = lum(a), lb = lum(b);
  return (Math.max(la,lb) + 0.05) / (Math.min(la,lb) + 0.05);
}

/* ═══ state ═══════════════════════════════════════════════════ */

const KEY = "pickem26.v2", RKEY = "pickem26.rivals.v2";
let state = blank();
let mode = "season";
let lane = "team";        // "team" | "week"
let team = "BUF";
let weekSel = 1;
let shared = null;        // {name} when viewing someone else's picks
let rivals = [];          // [{name, code, st}] — friends' sheets, decoded
let rivalSel = 0;
let computing = false;    // true while analysing someone else's state
let showScores = false;   // predicted scores are opt-in — most people only call winners
let cursor = -1;          // keyboard position within the rendered slab list
let slabGames = [];       // game indices, in render order

function blank(){
  return {name:"", fav:"", picks:{}, po:{}, order:{AFC:[], NFC:[]}};
}
let storageOK = true;

/* Editing someone else's shared sheet used to be silently discarded: the W/L
   buttons still responded and the screen still updated, but save() bailed out
   because `shared` was set, so everything vanished on reload. Changing a pick
   is unambiguously an intent to own the sheet, so it now takes ownership. */
function save(){
  if (computing) return;
  if (shared) takeOwnership();
  persist();
}
function persist(){
  const was = storageOK;
  try {
    localStorage.setItem(KEY, JSON.stringify(state));
    storageOK = true;
  } catch(e){
    storageOK = false;
  }
  if (was !== storageOK) renderBanner();
}
function takeOwnership(){
  const whose = shared && shared.name;
  shared = null;
  state.name = "";
  /* their club does not come with the picks — keep your own if you had one */
  let mine = "";
  try { mine = (JSON.parse(localStorage.getItem(KEY) || "{}").fav) || ""; } catch(e){}
  if (TEAMS[mine]){ state.fav = mine; team = mine; }
  try { history.replaceState(null, "", location.pathname + location.search); } catch(e){}
  toast(whose ? "You changed a pick — this is your copy now, not " + whose + "'s."
              : "You changed a pick — this is your own copy now.");
}
function remember(k, v){ try { localStorage.setItem(KEY + "." + k, v); } catch(e){} }
function recall(k){ try { return localStorage.getItem(KEY + "." + k); } catch(e){ return null; } }

/* run fn with someone else's picks installed as the current state. every
   record/seed/bracket helper reads the globals, so swapping them here is
   cheaper than threading a state argument through all of them. saving is
   locked out for the duration so a friend's sheet can never overwrite yours. */
function withState(st, fn){
  const s0 = state, r0 = R, c0 = computing;
  state = st; computing = true; R = buildRecords();
  try { return fn(); } finally { state = s0; R = r0; computing = c0; }
}

/* everything the compare and receipts screens need from one sheet */
function analyze(st){
  return withState(st, function(){
    const S = standings();
    const A = bracketFor("AFC", S), N = bracketFor("NFC", S);
    const res = [];
    for (let i = 0; i < NGAMES; i++) res.push(resultOf(i));
    return {
      rec:R, S:S, res:res, afc:A, nfc:N,
      sb:(A.champ && N.champ) ? advOf("SB", A.champ, N.champ) : null,
      decided:res.filter(Boolean).length
    };
  });
}
function load(){
  try {
    const raw = localStorage.getItem(KEY);
    if (raw){
      const d = JSON.parse(raw);
      state = Object.assign(blank(), d);
      state.order = Object.assign({AFC:[], NFC:[]}, d.order || {});

function pickOf(i){ return state.picks[i] || null; }

/* result of game i: "A" | "H" | "T" | null */
function resultOf(i){
  const p = state.picks[i];
  if (!p) return null;
  if (p.as != null && p.hs != null){
    if (p.as === p.hs) return "T";
    return p.as > p.hs ? "A" : "H";
  }
  return p.w || null;
}

function setWinner(i, side){
  const p = state.picks[i] || {w:null, as:null, hs:null};
  if (p.w === side && !p.a && !(p.as != null && p.hs != null)){
    delete state.picks[i];                    // second tap un-picks
  } else {
    delete p.a;                               // touching it makes it yours
    // if both scores exist and contradict, flip them so the tap always wins
    if (p.as != null && p.hs != null && p.as !== p.hs){
      const leader = p.as > p.hs ? "A" : "H";
      if (leader !== side){ const s = p.as; p.as = p.hs; p.hs = s; }
    }
    p.w = side;
    state.picks[i] = p;
  }
  save();
}

function setScore(i, side, val){
  const p = state.picks[i] || {w:null, as:null, hs:null};
  const n = val === "" ? null : Math.max(0, Math.min(199, parseInt(val, 10)));
  delete p.a;
  p[side === "A" ? "as" : "hs"] = (n == null || isNaN(n)) ? null : n;
  if (p.as != null && p.hs != null && p.as !== p.hs) p.w = p.as > p.hs ? "A" : "H";
  if (p.w == null && p.as == null && p.hs == null) delete state.picks[i];
  else state.picks[i] = p;
  save();
}

function hasAnyScores(){
  for (const k in state.picks){
    const p = state.picks[k];
    if (p && (p.as != null || p.hs != null)) return true;
  }
  return false;
}
function decidedCount(){
  let n = 0;
  for (let i = 0; i < NGAMES; i++) if (resultOf(i)) n++;
  return n;
}
/* a filled-in game counts toward the standings but was never your opinion */
function isAuto(i){ const p = state.picks[i]; return !!(p && p.a && resultOf(i)); }
function handCount(){
  let n = 0;
  for (let i = 0; i < NGAMES; i++) if (resultOf(i) && !isAuto(i)) n++;
  return n;
}
function autoCount(){
  let n = 0;
  for (let i = 0; i < NGAMES; i++) if (isAuto(i)) n++;
  return n;
}
function clearAuto(){
  for (let i = 0; i < NGAMES; i++) if (isAuto(i)) delete state.picks[i];
  save();
}

/* ── projecting a season you have not called by hand ──
   last season's record becomes a rating, home field is worth a little, and a
   hash of the fixture decides the coin-flips — so it is deterministic, but the
   favourite does not sweep the league the way a pure ranking would. */
/* last season only weakly predicts this one, so the rating is shrunk hard
   toward .500 — otherwise last year's best team sweeps and the fill looks silly */
function rating(abbr){
  const ly = LAST_YEAR[abbr];
  return ((ly[0] + 0.5 * ly[2]) - 8.5) * 0.135;
}
function fixtureNoise(g){
  let h = 2166136261;
  const s = g.away + "@" + g.home + ":" + g.week;
  for (let i = 0; i < s.length; i++){ h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
  return ((h >>> 0) % 10000) / 10000;
}
function projectedWinner(g){
  const edge = (rating(g.home) + (g.neutral ? 0 : 0.26)) - rating(g.away);
  const pHome = 1 / (1 + Math.exp(-edge * 1.7));
  return fixtureNoise(g) < pHome ? "H" : "A";
}

/* fill every game you have not called, leaving your own calls untouched */
function fillRest(){
  let n = 0;
  SCHEDULE.forEach(function(g){
    if (resultOf(g.i)) return;
    state.picks[g.i] = {w:projectedWinner(g), as:null, hs:null, a:1};
    n++;
  });
  save();
  return n;
}

/* ── win totals ──
   free games are everything you have not called by hand. assign each one to
   whichever side is further from its target, then flip any game where the
   swap lowers total error. manual picks are never touched. */
function solveTotals(targets){
  const manualW = {}, remain = {}, need = {}, free = [];
  ORDER.forEach(function(a){ manualW[a] = 0; remain[a] = 0; });

  SCHEDULE.forEach(function(g){
    const r = resultOf(g.i);
    if (r && !isAuto(g.i)){
      if (r === "T"){ manualW[g.away] += 0.5; manualW[g.home] += 0.5; }
      else if (r === "A") manualW[g.away]++;
      else manualW[g.home]++;
    } else {
      free.push(g); remain[g.away]++; remain[g.home]++;
    }
  });
  ORDER.forEach(function(a){ need[a] = targets[a] - manualW[a]; });

  const assign = {};
  free.forEach(function(g){
    const a = g.away, h = g.home;
    const ua = need[a] / Math.max(0.001, remain[a]);
    const uh = need[h] / Math.max(0.001, remain[h]);
    const homeWins = uh > ua || (uh === ua && !g.neutral);
    if (homeWins) need[h]--; else need[a]--;
    remain[a]--; remain[h]--;
    assign[g.i] = homeWins ? "H" : "A";
  });

  const winnerOf = function(g){ return assign[g.i] === "H" ? g.home : g.away; };
  const loserOf  = function(g){ return assign[g.i] === "H" ? g.away : g.home; };
  const flip     = function(g){ assign[g.i] = assign[g.i] === "H" ? "A" : "H"; };

  /* straight swaps: hand a win from a club that has too many to one short of its target */
  for (let pass = 0; pass < 8; pass++){
    let flips = 0;
    free.forEach(function(g){
      const w = winnerOf(g), l = loserOf(g);
      if (Math.abs(need[w] + 1) + Math.abs(need[l] - 1) < Math.abs(need[w]) + Math.abs(need[l])){
        need[w]++; need[l]--; flip(g); flips++;
      }
    });
    if (!flips) break;
  }

  /* what is left is not the schedule's fault — it is a local optimum. when a
     club short of its target never plays one with a surplus, route the win
     through a third club that is already on target. */
  const gamesOf = {};
  free.forEach(function(g){
    (gamesOf[g.away] = gamesOf[g.away] || []).push(g);
    (gamesOf[g.home] = gamesOf[g.home] || []).push(g);
  });
  for (let round = 0; round < 8; round++){
    let fixed = 0;
    ORDER.forEach(function(u){
      let guard = 0;
      while (need[u] > 0 && guard++ < 20){
        const gs = gamesOf[u] || [];
        let done = false;
        for (let i = 0; i < gs.length && !done; i++){
          const g = gs[i];
          if (loserOf(g) !== u) continue;
          const w = winnerOf(g);
          if (need[w] < 0){ flip(g); need[w]++; need[u]--; done = true; }
        }
        for (let i = 0; i < gs.length && !done; i++){
          const g = gs[i];
          if (loserOf(g) !== u) continue;
          const w = winnerOf(g), gs2 = gamesOf[w] || [];
          for (let j = 0; j < gs2.length; j++){
            const g2 = gs2[j];
            if (g2.i === g.i || loserOf(g2) !== w) continue;
            const w2 = winnerOf(g2);
            if (need[w2] >= 0) continue;
            flip(g); flip(g2); need[u]--; need[w2]++;
            done = true; break;
          }
        }
        if (!done) break;
        fixed++;
      }
    });
    if (!fixed) break;
  }

  free.forEach(function(g){ state.picks[g.i] = {w:assign[g.i], as:null, hs:null, a:1}; });
  save();
  let err = 0;
  ORDER.forEach(function(a){ err += Math.abs(need[a]); });
  return err;
}

/* ═══ records ═════════════════════════════════════════════════ */

let R = null;   // cache, rebuilt on every render

function buildRecords(){
  const r = {};
  ORDER.forEach(function(a){
    r[a] = {abbr:a, w:0, l:0, t:0, dw:0, dl:0, dt:0, cw:0, cl:0, ct:0,
            pf:0, pa:0, vs:{}, opps:[], played:0};
  });
  SCHEDULE.forEach(function(g){
    const A = g.away, H = g.home, ta = TEAMS[A], th = TEAMS[H];
    r[A].opps.push(H); r[H].opps.push(A);
    const res = resultOf(g.i);
    if (!res) return;
    const sameDiv = ta.divKey === th.divKey, sameConf = ta.conf === th.conf;
    const p = state.picks[g.i];
    if (p && p.as != null && p.hs != null){
      r[A].pf += p.as; r[A].pa += p.hs;
      r[H].pf += p.hs; r[H].pa += p.as;
    }
    r[A].played++; r[H].played++;
    bump(r[A], A, H, res === "T" ? "t" : (res === "A" ? "w" : "l"), sameDiv, sameConf);
    bump(r[H], H, A, res === "T" ? "t" : (res === "H" ? "w" : "l"), sameDiv, sameConf);
  });
  return r;
}
function bump(rec, self, opp, k, sameDiv, sameConf){
  rec[k]++;
  if (sameDiv) rec["d" + k]++;
  if (sameConf) rec["c" + k]++;
  const v = rec.vs[opp] = rec.vs[opp] || {w:0, l:0, t:0};
  v[k]++;
}
function pct(w, l, t){
  const g = w + l + t;
  return g ? (w + 0.5 * t) / g : 0;
}
function recPct(x){ return pct(x.w, x.l, x.t); }
function recStr(x){ return x.t ? x.w + "-" + x.l + "-" + x.t : x.w + "-" + x.l; }

/* ═══ tiebreakers ═════════════════════════════════════════════ */
/* NFL order, applied to a tied group. A step returns null when it does not
   apply (e.g. common games under the 4-game minimum), in which case it is
   skipped rather than treated as a zero. */

function h2hValue(a, pool){
  let w = 0, l = 0, t = 0;
  pool.forEach(function(b){
    if (b === a) return;
    const v = R[a].vs[b];
    if (v){ w += v.w; l += v.l; t += v.t; }
  });
  return (w + l + t) === 0 ? null : pct(w, l, t);
}
function commonValue(a, pool){
  const sets = pool.map(function(x){ return R[x].opps.filter(function(o){ return pool.indexOf(o) < 0; }); });
  let common = sets[0].filter(function(o, i){ return sets[0].indexOf(o) === i; });
  for (let i = 1; i < sets.length; i++) common = common.filter(function(o){ return sets[i].indexOf(o) >= 0; });
  let w = 0, l = 0, t = 0;
  common.forEach(function(o){
    const v = R[a].vs[o];
    if (v){ w += v.w; l += v.l; t += v.t; }
  });
  const total = pool.reduce(function(m, x){
    return Math.min(m, common.reduce(function(n, o){
      const v = R[x].vs[o]; return n + (v ? v.w + v.l + v.t : 0);
    }, 0));
  }, 99);
  if (total < 4) return null;
  return (w + l + t) === 0 ? null : pct(w, l, t);
}
function combinedRecordOf(list){
  let w = 0, l = 0, t = 0;
  list.forEach(function(o){ w += R[o].w; l += R[o].l; t += R[o].t; });
  return pct(w, l, t);
}
function sov(a){
  const beaten = [];
  ORDER.forEach(function(o){
    const v = R[a].vs[o];
    if (v) for (let k = 0; k < v.w; k++) beaten.push(o);
  });
  return beaten.length ? combinedRecordOf(beaten) : 0;
}
function sos(a){
  const faced = [];
  ORDER.forEach(function(o){
    const v = R[a].vs[o];
    if (v) for (let k = 0; k < v.w + v.l + v.t; k++) faced.push(o);
  });
  return faced.length ? combinedRecordOf(faced) : 0;
}
function netPts(a){ return R[a].pf - R[a].pa; }

const LABEL = {
  rec:"record", h2h:"head-to-head", div:"division record", com:"common games",
  conf:"conference record", sov:"strength of victory", sos:"strength of schedule",
  net:"point differential", order:"your call"
};

function steps(scope){
  const s = [
    {k:"rec", f:function(a){ return recPct(R[a]); }},
    {k:"h2h", f:h2hValue}
  ];
  if (scope === "div") s.push({k:"div", f:function(a){ return pct(R[a].dw, R[a].dl, R[a].dt); }});
  s.push({k:"com", f:commonValue});
  s.push({k:"conf", f:function(a){ return pct(R[a].cw, R[a].cl, R[a].ct); }});
  s.push({k:"sov", f:sov});
  s.push({k:"sos", f:sos});
  s.push({k:"net", f:netPts});
  return s;
}

/* for the conference scope, head-to-head among 3+ clubs only counts as a sweep */
function applyStep(step, pool, scope){
  let vals;
  if (step.k === "h2h" && scope === "conf" && pool.length > 2){
    vals = pool.map(function(a){
      let w = 0, l = 0, t = 0;
      pool.forEach(function(b){
        if (b === a) return;
        const v = R[a].vs[b];
        if (v){ w += v.w; l += v.l; t += v.t; }
      });
      const need = pool.length - 1;
      if (w + l + t < need) return null;          // did not play everyone
      if (l === 0 && t === 0) return 1;           // swept the group
      if (w === 0 && t === 0) return -1;          // swept by the group
      return 0;
    });
    if (vals.every(function(v){ return v === 0; })) return null;
  } else {
    vals = pool.map(function(a){ return step.f(a, pool); });
  }
  if (vals.some(function(v){ return v === null; })) return null;
  const max = Math.max.apply(null, vals);
  const top = pool.filter(function(a, i){ return vals[i] === max; });
  return top.length < pool.length ? top : null;
}

function manualIndex(a){
  const list = state.order[TEAMS[a].conf] || [];
  const i = list.indexOf(a);
  return i < 0 ? 500 + ORDER.indexOf(a) : i;
}

/* returns [{t, by}] — `by` is the criterion that placed the team */
function rankGroup(pool, scope, depth){
  depth = depth || 0;
  let rest = pool.slice(), out = [], guard = 0;
  while (rest.length > 1 && guard++ < 40){
    let top = null, by = null;
    const st = steps(scope);
    for (let i = 0; i < st.length; i++){
      const t = applyStep(st[i], rest, scope);
      if (t){ top = t; by = st[i].k; break; }
    }
    if (!top){
      rest.sort(function(a, b){ return manualIndex(a) - manualIndex(b); });
      rest.forEach(function(a){ out.push({t:a, by:"order"}); });
      rest = [];
      break;
    }
    if (top.length === 1){
      out.push({t:top[0], by:by});
      rest = rest.filter(function(a){ return a !== top[0]; });
    } else if (depth < 6){
      rankGroup(top, scope, depth + 1).forEach(function(x){ out.push(x); });
      rest = rest.filter(function(a){ return top.indexOf(a) < 0; });
    } else {
      top.sort(function(a, b){ return manualIndex(a) - manualIndex(b); });
      top.forEach(function(a){ out.push({t:a, by:"order"}); });
      rest = rest.filter(function(a){ return top.indexOf(a) < 0; });
    }
  }
  if (rest.length === 1) out.push({t:rest[0], by:null});
  return out;
}

/* division standings + conference seeding.
   rebuilds the record cache first on purpose: seeding feeds bracketFor, which
   drops postseason picks whose matchup no longer exists. running that against
   a stale R would quietly delete picks the user actually made. */
function standings(){
  R = buildRecords();
  const divRank = {};
  DIV_KEYS.forEach(function(k){ divRank[k] = rankGroup(DIVS[k], "div"); });

  const seeds = {};
  ["AFC","NFC"].forEach(function(conf){
    const keys = DIV_KEYS.filter(function(k){ return k.indexOf(conf) === 0; });
    const winners = keys.map(function(k){ return divRank[k][0].t; });
    const wr = rankGroup(winners, "conf");

    const queue = {};
    keys.forEach(function(k){ queue[k] = divRank[k].slice(1).map(function(x){ return x.t; }); });

    const wilds = [];
    for (let n = 0; n < 3; n++){
      const eligible = keys.map(function(k){ return queue[k][0]; }).filter(Boolean);
      if (!eligible.length) break;
      const best = rankGroup(eligible, "conf")[0];
      wilds.push(best);
      queue[TEAMS[best.t].divKey].shift();
    }

    const restPool = [];
    keys.forEach(function(k){ queue[k].forEach(function(a){ restPool.push(a); }); });
    const rest = rankGroup(restPool, "conf");

    seeds[conf] = wr.map(function(x, i){ return {t:x.t, by:x.by, seed:i + 1, div:true}; })
      .concat(wilds.map(function(x, i){ return {t:x.t, by:x.by, seed:i + 5, div:false}; }))
      .concat(rest.map(function(x, i){ return {t:x.t, by:x.by, seed:i + 8, div:false, outside:true}; }));
  });
  return {divRank:divRank, seeds:seeds};
}

/* ═══ bracket ═════════════════════════════════════════════════ */

function seedInfo(conf, S){
  const m = {};
  S.seeds[conf].forEach(function(x){ m[x.t] = x.seed; });
  return m;
}
function advOf(key, a, b){
  const v = state.po[key];
  if (v && (v === a || v === b)) return v;
  if (v){ delete state.po[key]; }
  return null;
}
function bracketFor(conf, S){
  const line = S.seeds[conf].filter(function(x){ return !x.outside; });
  const abbr = line.map(function(x){ return x.t; });
  const wc = [
    {key:conf + ".wc0", a:abbr[1], b:abbr[6], sa:2, sb:7},
    {key:conf + ".wc1", a:abbr[2], b:abbr[5], sa:3, sb:6},
    {key:conf + ".wc2", a:abbr[3], b:abbr[4], sa:4, sb:5}
  ];
  const seedOf = {};
  line.forEach(function(x){ seedOf[x.t] = x.seed; });

  const wcWin = wc.map(function(m){ return advOf(m.key, m.a, m.b); });
  let dv = [], alive = null;
  if (wcWin.every(Boolean)){
    alive = [abbr[0]].concat(wcWin).sort(function(a, b){ return seedOf[a] - seedOf[b]; });
    dv = [
      {key:conf + ".dv0", a:alive[0], b:alive[3], sa:seedOf[alive[0]], sb:seedOf[alive[3]]},
      {key:conf + ".dv1", a:alive[1], b:alive[2], sa:seedOf[alive[1]], sb:seedOf[alive[2]]}
    ];
  } else {
    dv = [{key:conf + ".dv0"}, {key:conf + ".dv1"}];
  }
  const dvWin = dv.map(function(m){ return m.a ? advOf(m.key, m.a, m.b) : null; });
  let cc = {key:conf + ".cc"};
  if (dvWin.every(Boolean)){
    const two = dvWin.slice().sort(function(a, b){ return seedOf[a] - seedOf[b]; });
    cc = {key:conf + ".cc", a:two[0], b:two[1], sa:seedOf[two[0]], sb:seedOf[two[1]]};
  } else {
    advOf(conf + ".cc", "", "");
  }
  const champ = cc.a ? advOf(cc.key, cc.a, cc.b) : null;
  return {line:line, bye:abbr[0], wc:wc, dv:dv, cc:cc, champ:champ, seedOf:seedOf};
}

function el(tag, attrs, kids){

  if (attrs) for (const k in attrs){
    if (k === "style") n.setAttribute("style", attrs[k]);
    else if (k === "html") n.innerHTML = attrs[k];
    else if (k.slice(0,2) === "on") n.addEventListener(k.slice(2), attrs[k]);
    else if (attrs[k] != null && attrs[k] !== false) n.setAttribute(k, attrs[k]);
  }
  (kids || []).forEach(function(c){
    if (c == null || c === false) return;
    n.appendChild(typeof c === "string" ? document.createTextNode(c) : c);
  });
  return n;
}

  if (rail.scrollWidth > rail.clientWidth){
    rail.scrollLeft = chip.offsetLeft - rail.clientWidth / 2 + chip.offsetWidth / 2;
  }
  if (rail.scrollHeight > rail.clientHeight){
    const top = chip.offsetTop, bottom = top + chip.offsetHeight;

let totals = null;   // {abbr: wins} while the lane is open

function currentWins(a){
  const r = R[a];
  return r.played ? r.w + (r.t ? 0.5 * r.t : 0) : LAST_YEAR[a][0];
}
/* rounding 32 records to whole wins rarely lands on 272 exactly — last season
   had a tie, so it comes to 271. nudge the closest calls until it balances,
   otherwise the screen opens complaining about a gap you did not create. */
function balancedTotals(fn){
  const t = {}, resid = [];
  ORDER.forEach(function(a){
    const exact = fn(a);
    t[a] = Math.round(exact);
    resid.push({a:a, r:exact - t[a]});
  });
  let sum = ORDER.reduce(function(n, a){ return n + t[a]; }, 0);
  resid.sort(function(x, y){ return y.r - x.r; });
  let i = 0;
  while (sum < 272 && i < resid.length){
    const a = resid[i++].a;
    if (t[a] < 17){ t[a]++; sum++; }
  }
  i = resid.length - 1;
  while (sum > 272 && i >= 0){
    const a = resid[i--].a;
    if (t[a] > 0){ t[a]--; sum--; }
  }
  return t;
}
function ensureTotals(){
  if (!totals) totals = balancedTotals(currentWins);
}
function manualWinsOf(a){
  let w = 0;
  BY_TEAM[a].forEach(function(g){
    const r = resultOf(g.i);
    if (!r || isAuto(g.i)) return;
    if (r === "T") w += 0.5;
    else if ((r === "H") === (g.home === a)) w++;
  });
  return w;
}

      : (sum > 272

          : "That is " + (272 - sum) + (272 - sum === 1 ? " win" : " wins") + " short of a full season — something has to give.")]),
    el("button", {"class":"btn", onclick:function(){

        ])
      ]));
    });
    grid.appendChild(card);

    const dots = el("span", {"class":"dots"});
    /* four dots stand in for the week's completion, so a glance down the bar
       shows where the gaps are without reading numbers */
    for (let d = 0; d < 4; d++){
      dots.appendChild(el("i", {"class":done / gs.length > d / 4 ? "on" : ""}));
    }
    bar.appendChild(el("button", {
      "class":"wkchip", "aria-current":String(w === weekSel),

      onclick:(function(n){ return function(){ setWeek(n); }; })(w)
    }, [el("span", {"class":"n"}, [String(w)]), dots]));
  }
  return bar;
}
function setWeek(w){
  weekSel = Math.max(1, Math.min(18, w));

  remember("week", String(weekSel));
  render();
  window.scrollTo({top:0, behavior:"smooth"});

function nextOpenWeek(){
  for (let k = 1; k <= 18; k++){
    const w = ((weekSel - 1 + k) % 18) + 1;
    if (SCHEDULE.some(function(g){ return g.week === w && !resultOf(g.i); })){ setWeek(w); return; }
  }
  toast("Every week is filled in. Head to Postseason.");
}
function dayLabel(iso){

function longDay(iso){

/* "the Bears", "the Bears and Jets", "the Bears, Jets and 4 more" */
function listOf(names){
  if (names.length <= 2) return names.join(" and ");
  if (names.length <= 4) return names.slice(0, -1).join(", ") + " and " + names[names.length - 1];
  return names.slice(0, 3).join(", ") + " and " + (names.length - 3) + " more";
}
function ordinal(n){
  const s = ["th","st","nd","rd"], v = n % 100;
  return n + (s[(v - 20) % 10] || s[v] || s[0]);
}
function shortDate(iso){
  const p = iso.split("-");
  const d = new Date(Date.UTC(+p[0], +p[1] - 1, +p[2]));
  return ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"][d.getUTCDay()] + " " + (+p[1]) + "/" + (+p[2]);
}
function timeLabel(time){
  let h = +time.split(":")[0];
  const m = time.split(":")[1], ap = h >= 12 ? "pm" : "am";
  h = h % 12 || 12;
  return h + ":" + m + " " + ap + " ET";
}
function longDate(iso, time){
  const p = iso.split("-");
  const d = new Date(Date.UTC(+p[0], +p[1] - 1, +p[2]));
  const days = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
  const mons = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  return days[d.getUTCDay()] + ", " + mons[+p[1] - 1] + " " + (+p[2]) + " · " + timeLabel(time);
}

/* the team lane reads like a club's own schedule: you are looking at one team,
   so the call is W or L, not which of two clubs wins. it writes the same pick
   the week lane does — a W for the home side is a home-side winner. */
function growEl(g){
  const home = g.home === team;
  const opp = TEAMS[home ? g.away : g.home];
  const res = resultOf(g.i);
  const mine = home ? "H" : "A";
  const won = res === mine, lost = res && res !== mine && res !== "T", tied = res === "T";
  slabGames.push(g.i);

  const edge = won ? "var(--win)" : lost ? "var(--loss)" : tied ? "var(--brass)" : "transparent";
  const auto = isAuto(g.i);
  const row = el("div", {
    "class":"grow" + (won ? " won" : "") + (lost ? " lost" : "") + (tied ? " tied" : "") +
      (auto ? " auto" : ""),
    "data-i":String(g.i),
    style:"--edge:" + edge
  });

  row.appendChild(el("div", {"class":"opp"}, [
    crest(opp.abbr, "sm"),
    el("span", {"class":"otxt"}, [
      el("span", {"class":"ha"}, [g.neutral ? "vs" : (home ? "vs" : "at")]),
      el("span", {"class":"onm"}, [opp.name]),
      el("span", {"class":"ometa", html:opp.abbr + " " + recStr(R[opp.abbr]) + " · " + timeLabel(g.time) +
        (g.neutral ? ' · <span class="intl">' + esc(g.neutral) + "</span>" : "")})
    ])
  ]));

  if (tied) row.appendChild(el("span", {"class":"tiechip"}, ["TIE"]));

  if (auto) row.appendChild(el("span", {"class":"fillmark",
    title:"Filled in from last season — tap W or L to make it yours"}, ["filled"]));

  row.appendChild(el("div", {"class":"wl"}, [
    wlBtn(g, "W", won, home, auto), wlBtn(g, "L", lost, home, auto)
  ]));

  if (showScores){
    row.appendChild(el("div", {"class":"scores"}, [
      scoreFor(g, home ? "H" : "A", TEAMS[team]),
      el("span", {"class":"lbl"}, ["–"]),
      scoreFor(g, home ? "A" : "H", opp)
    ]));
  }
  return row;
}

function slabEl(g, compact){
  const res = resultOf(g.i);
  const ta = TEAMS[g.away], th = TEAMS[g.home];
  const edge = res === "A" ? ta.pop : res === "H" ? th.pop : res === "T" ? "var(--brass)" : "transparent";
  slabGames.push(g.i);

  const slab = el("div", {
    "class":"slab" + (res ? " decided" : "") + (isAuto(g.i) ? " auto" : ""),

  slab.appendChild(el("div", {"class":"slab-in"}, [
    el("div", {"class":"half away"}, [sideEl(g, "A", ta, res), showScores ? scoreEl(g, "A", ta) : null]),
    el("div", {"class":"at"}, [
      res === "T" ? el("span", {"class":"tie"}, ["TIE"]) : null,
      el("span", {}, [g.neutral ? "VS" : "AT"])

    el("div", {"class":"half home"}, [sideEl(g, "H", th, res), showScores ? scoreEl(g, "H", th) : null])

  slab.appendChild(el("div", {"class":"slab-foot"}, [
    el("span", {"class":"when", html:(compact ? timeLabel(g.time) : longDate(g.date, g.time)) +

    el("span", {"class":"nudge-hint"}, [isAuto(g.i) ? "filled" : res ? "" : "Tap a side"])
  ]));
  return slab;
}

function paintCursor(scroll){
  const prev = document.querySelector(".cursor[data-i]");
  if (prev) prev.classList.remove("cursor");
  if (cursor < 0 || cursor >= slabGames.length) return;
  const n = document.querySelector('[data-i="' + slabGames[cursor] + '"]');
  if (!n) return;
  n.classList.add("cursor");
  if (scroll) n.scrollIntoView({block:"center", behavior:"smooth"});
}

document.addEventListener("keydown", function(e){
  if (mode !== "season" || shared) return;
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const tag = (e.target.tagName || "").toLowerCase();
  if (tag === "input" || tag === "textarea" || tag === "select") return;
  if ($("#modal").firstChild) return;
  if (!slabGames.length) return;

  const k = e.key;
  if (k === "ArrowDown" || k === "ArrowUp"){
    e.preventDefault();
    const from = cursor < 0 ? (k === "ArrowDown" ? -1 : 1) : cursor;
    cursor = Math.max(0, Math.min(slabGames.length - 1, from + (k === "ArrowDown" ? 1 : -1)));
    paintCursor(true);
  } else if (k === "ArrowLeft" || k === "ArrowRight" || /^[wWlL]$/.test(k)){
    const letter = /^[wWlL]$/.test(k);
    if (letter && lane !== "team") return;   // W/L only mean something for one club
    e.preventDefault();
    if (cursor < 0) cursor = 0;
    const gi = slabGames[cursor], g = SCHEDULE[gi];
    let side;
    if (lane === "team"){
      const home = g.home === team;
      const wantWin = k === "ArrowRight" || k === "w" || k === "W";
      side = wantWin ? (home ? "H" : "A") : (home ? "A" : "H");
    } else {
      side = k === "ArrowLeft" ? "A" : "H";
    }
    setWinner(gi, side);
    const next = Math.min(slabGames.length - 1, cursor + 1);
    render();
    cursor = next;
    paintCursor(true);
  } else if (k === "Backspace" || k === "Delete"){
    e.preventDefault();
    if (cursor >= 0){
      delete state.picks[slabGames[cursor]];
      save();
      const at = cursor;
      render();
      cursor = at;
      paintCursor(false);
    }
  }
});

function seedCard(conf, S){
  const card = el("div", {"class":"seedcard"}, [el("h3", {}, [conf + " PICTURE"])]);

        [x.by && x.by !== "rec" ? LABEL[x.by] : ""]),

    ]));
  });

function nudgeEl(conf, list, i){
  const up = el("button", {
    "aria-label":"Move up", disabled:i === 0 ? "disabled" : false,
    onclick:function(){ reorder(conf, list, i, -1); }
  }, ["▲"]);
  const dn = el("button", {
    "aria-label":"Move down", disabled:i === list.length - 1 ? "disabled" : false,
    onclick:function(){ reorder(conf, list, i, 1); }
  }, ["▼"]);
  return el("span", {"class":"nudge"}, [up, dn]);
}

/* pin the current computed order, then swap the two rows the user targeted.
   the pinned order becomes the last-resort tiebreak, so it only ever decides
   clubs that the real criteria could not separate. */
function reorder(conf, list, i, dir){
  const j = i + dir;
  if (j < 0 || j >= list.length) return;
  const arr = list.map(function(x){ return x.t; });
  const tmp = arr[i]; arr[i] = arr[j]; arr[j] = tmp;
  state.order[conf] = arr;
  save();
  const after = standings();
  const moved = after.seeds[conf].map(function(x){ return x.t; }).indexOf(list[i].t);
  if (moved === i) toast(TEAMS[list[i].t].nick + " is held there by " + (LABEL[list[j].by] || "the tiebreakers") + ", not by order.");
  render();
}

  ].concat(B.wc.map(function(m){ return muEl(m, B); }))));

function muEl(m, B){
  if (!m.a) return el("div", {"class":"mu pending"}, [
    el("div", {"class":"slot empty"}, ["Winners to be decided"])
  ]);
  const pick = advOf(m.key, m.a, m.b);
  const mu = el("div", {"class":"mu"});
  [[m.a, m.sa], [m.b, m.sb]].forEach(function(pair){
    const a = pair[0], t = TEAMS[a];
    const adv = pick === a, out = pick && pick !== a;
    mu.appendChild(el("button", {
      "class":"slot" + (adv ? " adv" : "") + (out ? " out" : ""),
      style:"--c:" + t.pop, "aria-pressed":String(adv),
      onclick:function(){
        if (state.po[m.key] === a) delete state.po[m.key];
        else state.po[m.key] = a;
        save(); render();
      }
    }, [
      el("span", {"class":"sn"}, [String(pair[1])]),
      crest(a, "xs"),
      el("span", {"class":"nm"}, [t.name]),
      el("span", {"class":"rc"}, [recStr(R[a])])
    ]));
  });
  mu.appendChild(el("div", {"class":"tag"}, [
    "at " + TEAMS[m.a].city + (m.sa === 1 ? " · top seed" : "")
  ]));
  return mu;
}
